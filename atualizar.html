<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atualizar PDVMix</title><style>body{font-family:system-ui,sans-serif;background:#f7f2e8;color:#2f3b2b;display:grid;place-items:center;min-height:100vh;margin:0}.c{max-width:520px;margin:20px;padding:28px;border-radius:24px;background:#fff;box-shadow:0 15px 45px #0001;text-align:center}button{border:0;border-radius:14px;padding:14px 18px;background:#35572b;color:#fff;font-weight:800;font-size:16px;width:100%}p{line-height:1.5;color:#666}</style></head><body><div class="c"><h1>Atualizar PDVMix</h1><p>Use este botão somente quando o navegador insistir em mostrar uma versão antiga do aplicativo.</p><button onclick="refreshApp()">Limpar cache e carregar versão atual</button><p id="msg"></p></div><script>async function refreshApp(){const m=document.getElementById('msg');m.textContent='Atualizando...';try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs)await r.unregister()}if('caches'in window){const ks=await caches.keys();for(const k of ks)await caches.delete(k)}m.textContent='Pronto. Abrindo o PDVMix atualizado...';setTimeout(()=>location.replace('./?refresh='+Date.now()),700)}catch(e){m.textContent='Não foi possível limpar automaticamente. Feche o navegador e abra novamente.'}}</script></body></html>
