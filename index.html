  .stock-side{min-width:100%;text-align:left;padding-left:60px}
  .stock-main-actions{justify-content:flex-start}
  .manager-grid{grid-template-columns:1fr}
  .cash-quick-go{display:none}
}

/* Celulares compactos como iPhone SE / Android 360 */
@media (max-width:380px){
  .brand-mini img{width:42px;height:42px}
  .brand-mini b{font-size:15px}
  .brand-mini small{display:none}
  .hero h1{font-size:28px}
  .action-grid{grid-template-columns:repeat(2,1fr)}
  .product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .product b{font-size:12px}
  .product .price{font-size:14px}
  .pie-wrap{flex-direction:column;align-items:center}
  .pie-legend{width:100%}
  .mf{flex-direction:column-reverse}
  .mf .btn{width:100%}
}

/* Celular em modo paisagem */
@media (max-height:540px) and (orientation:landscape) and (max-width:1000px){
  .topbar{position:relative;padding-top:8px;padding-bottom:4px}
  .brand-mini img{width:38px;height:38px}
  .hero{padding-top:14px;padding-bottom:48px}
  .sheet{max-height:96dvh}
  .mb{max-height:calc(96dvh - 118px)}
  nav button{min-height:44px}
}

/* Dispositivos com mouse/trackpad: feedback sem afetar toque */
@media (hover:hover) and (pointer:fine){
  .btn:hover,.iconbtn:hover,.chip:hover,.pill:hover,.manager-action:hover,.cadastro-card:hover{filter:brightness(.985);box-shadow:0 7px 20px rgba(75,22,90,.08)}
  .action:hover .circle{transform:translateY(-1px)}
}

</style>

<script>

const TUTORIAL_VERSION='2';

const LS_KEY='pdvmix_db';
const LS_AUTH='pdvmix_auth';
const IDB_NAME='pdvmix_media';
let DB=null,_cryptoKey=null,currentTab='inicio',cart=[],pdvCategory='todos',pdvSearch='',selectedPayment='pix',selectedCustomer='',cashReceived='';
let deferredInstallPrompt=null;
const $=id=>document.getElementById(id); const money=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); const uid=()=>crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36);
function dateObj(v=new Date()){if(v instanceof Date)return new Date(v);const t=String(v||'');return /^\d{4}-\d{2}-\d{2}$/.test(t)?new Date(t+'T12:00:00'):new Date(t)} const ymd=(v=new Date())=>{const d=dateObj(v);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}; const today=()=>ymd(new Date()); const dateBR=s=>s?dateObj(s).toLocaleDateString('pt-BR'):'—';
function esc(s){return String(s??'').replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));}
function ic(name,size=20){return `<svg class="ic" style="width:${size}px;height:${size}px"><use href="#i-${name}"/></svg>`}
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;$('toastHost').appendChild(el);setTimeout(()=>el.remove(),2500)}
function fmtInputDate(d){return ymd(d)}
function defaultDB(){
 const p=(name,cat,price,cost,stock,min,unit='un')=>({id:uid(),name,category:cat,price,cost,stock,min,unit,active:true,trackStock:true});
 return {
  version:APP_VERSION,
  store:{name:'Minha Loja PDVMix',cnpj:'',phone:'',goal:3000},
  products:[
   p('Açaí 300ml','acai',14,6.2,40,10),p('Açaí 500ml','acai',19,8.1,35,10),p('Açaí 700ml','acai',24,10.3,28,8),
   p('Sorvete 2 bolas','sorvete',12,4.8,35,8),p('Milk-shake 400ml','bebida',18,7.2,22,6),p('Esfiha de carne','salgado',8,3.1,30,8),
   p('Empada de frango','salgado',9,3.6,25,6),p('Água 500ml','bebida',4,1.5,48,12),p('Refrigerante lata','bebida',6,2.7,48,12)
  ],
  categories:[{id:'acai',name:'Açaí'},{id:'sorvete',name:'Sorvetes'},{id:'bebida',name:'Bebidas'},{id:'salgado',name:'Salgados'},{id:'adicional',name:'Adicionais'},{id:'combo',name:'Combos'}],
  sales:[],purchases:[],expenses:[],customers:[],suppliers:[],receivables:[],stockMoves:[],cashSessions:[],cashMoves:[],settings:{notifyLowStock:true,dark:false,userName:'Administrador',creditFeePct:0,debitFeePct:0,pixFeePct:0,minComboMargin:25,selfServiceProfiles:[{id:uid(),name:'Self-service',priceKg:0,costKg:0,tareG:0,active:true}]},nextSale:1001
 };
}
function normalizeDB(){
 if(!DB)DB=defaultDB();
 ['products','categories','sales','purchases','expenses','customers','suppliers','receivables','stockMoves','cashSessions','cashMoves'].forEach(k=>{if(!Array.isArray(DB[k]))DB[k]=[]});
 if(!DB.store)DB.store={name:'Minha Loja PDVMix',cnpj:'',phone:'',goal:3000};
 if(!DB.settings)DB.settings={};
 if(!DB.settings.userName)DB.settings.userName='Administrador';
 if(DB.settings.creditFeePct==null)DB.settings.creditFeePct=0;
 if(DB.settings.debitFeePct==null)DB.settings.debitFeePct=0;
 if(DB.settings.pixFeePct==null)DB.settings.pixFeePct=0;
 if(DB.settings.minComboMargin==null)DB.settings.minComboMargin=25;
 if(!Array.isArray(DB.settings.selfServiceProfiles))DB.settings.selfServiceProfiles=[];
 if(!DB.settings.selfServiceProfiles.length)DB.settings.selfServiceProfiles=[{id:uid(),name:'Self-service',priceKg:0,costKg:0,tareG:0,active:true}];
 DB.settings.selfServiceProfiles.forEach(x=>{if(!x.id)x.id=uid();if(x.priceKg==null)x.priceKg=0;if(x.costKg==null)x.costKg=0;if(x.tareG==null)x.tareG=0;if(x.active==null)x.active=true});
 DB.products.forEach(p=>{if(!Array.isArray(p.comboItems))p.comboItems=[];if(p.category==='combo'&&p.comboItems.length)p.trackStock=false});
 DB.version=APP_VERSION;if(!DB.nextSale)DB.nextSale=1001;
}
function b64e(u8){return btoa(String.fromCharCode(...u8))}function b64d(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function deriveKey(pass,salt){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function makeCheck(key){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode('pdvmix-ok'));return{iv:b64e(iv),ct:b64e(new Uint8Array(ct))}}
async function verifyKey(key,check){try{const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(check.iv)},key,b64d(check.ct));return new TextDecoder().decode(pt)==='pdvmix-ok'}catch(e){return false}}
function getAuth(){try{return JSON.parse(localStorage.getItem(LS_AUTH)||'null')}catch(e){return null}}
let saveTimer=null;function save(){clearTimeout(saveTimer);saveTimer=setTimeout(persistDB,120)}
async function persistDB(){if(!DB)return;const raw=JSON.stringify(DB);if(_cryptoKey){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},_cryptoKey,new TextEncoder().encode(raw));localStorage.setItem(LS_KEY,JSON.stringify({encrypted:true,iv:b64e(iv),ct:b64e(new Uint8Array(ct))}))}else localStorage.setItem(LS_KEY,raw)}
async function loadDBWithKey(key){const raw=localStorage.getItem(LS_KEY);if(!raw){DB=defaultDB();return}const parsed=JSON.parse(raw);if(parsed&&parsed.encrypted){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(parsed.iv)},key,b64d(parsed.ct));DB=JSON.parse(new TextDecoder().decode(pt))}else DB=parsed;normalizeDB()}
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open(IDB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore('media');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbPut(k,v){const db=await idbOpen();return new Promise((res,rej)=>{const tx=db.transaction('media','readwrite');tx.objectStore('media').put(v,k);tx.oncomplete=()=>res(true);tx.onerror=()=>rej(tx.error)})}
async function idbGet(k){const db=await idbOpen();return new Promise((res,rej)=>{const tx=db.transaction('media','readonly');const r=tx.objectStore('media').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbDel(k){const db=await idbOpen();return new Promise((res,rej)=>{const tx=db.transaction('media','readwrite');tx.objectStore('media').delete(k);tx.oncomplete=()=>res(true);tx.onerror=()=>rej(tx.error)})}
async function idbAll(){const db=await idbOpen();return new Promise((res,rej)=>{const out={};const tx=db.transaction('media','readonly');const st=tx.objectStore('media');const r=st.openCursor();r.onsuccess=e=>{const c=e.target.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};r.onerror=()=>rej(r.error)})}

function productUnitCost(p){if(!p)return 0;if(p.category==='combo'&&Array.isArray(p.comboItems)&&p.comboItems.length)return p.comboItems.reduce((a,it)=>{const c=DB.products.find(x=>x.id===it.productId);return a+Number(c?.cost||0)*Number(it.qty||0)},0);return Number(p.cost||0)}
function comboRegularPrice(p){if(!p||p.category!=='combo'||!Array.isArray(p.comboItems))return Number(p?.price||0);return p.comboItems.reduce((a,it)=>{const c=DB.products.find(x=>x.id===it.productId);return a+Number(c?.price||0)*Number(it.qty||0)},0)}
function productAvailableQty(p){if(!p)return 0;if(p.category==='combo'&&Array.isArray(p.comboItems)&&p.comboItems.length){const vals=p.comboItems.map(it=>{const c=DB.products.find(x=>x.id===it.productId);if(!c||!c.active)return 0;if(!c.trackStock)return Infinity;return Math.floor(Number(c.stock||0)/Math.max(.0001,Number(it.qty||0)))});return vals.length?Math.min(...vals):0}return p.trackStock?Number(p.stock||0):Infinity}

function comboDiscountAmount(p){return Math.max(0,comboRegularPrice(p)-Number(p?.price||0))}

function weightCalcValues(){const profile=ssProfile($('weightProfile')?.value),gross=Math.max(0,Number($('weightGross')?.value||0)),tare=Math.max(0,Number($('weightTare')?.value||0)),net=Math.max(0,gross-tare),priceKg=Number(profile?.priceKg||0),costKg=Number(profile?.costKg||0),value=Math.round((net/1000*priceKg+Number.EPSILON)*100)/100,cost=Math.round((net/1000*costKg+Number.EPSILON)*100)/100;return{profile,gross,tare,net,priceKg,costKg,value,cost}}

function financeTimeline(period){const now=new Date(),b=[];if(period==='today'){for(let i=0;i<6;i++)b.push({label:String(i*4).padStart(2,'0')+'h',match:d=>ymd(d)===today()&&new Date(d).getHours()>=i*4&&new Date(d).getHours()<(i+1)*4})}else if(period==='week'){for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(now.getDate()-i);const key=ymd(d);b.push({label:d.toLocaleDateString('pt-BR',{weekday:'short'}).slice(0,3),match:x=>ymd(x)===key})}}else if(period==='month'){const y=now.getFullYear(),m=now.getMonth();for(let w=0;w<5;w++){const a=w*7+1,z=Math.min(a+6,new Date(y,m+1,0).getDate());b.push({label:`${a}-${z}`,match:x=>{const d=new Date(String(x||today()).slice(0,10)+'T12:00:00');return d.getFullYear()===y&&d.getMonth()===m&&d.getDate()>=a&&d.getDate()<=z}})}}else{const y=now.getFullYear();for(let m=0;m<12;m++)b.push({label:new Date(y,m,1).toLocaleDateString('pt-BR',{month:'short'}).replace('.',''),match:x=>{const d=new Date(String(x||today()).slice(0,10)+'T12:00:00');return d.getFullYear()===y&&d.getMonth()===m}})}const revenue=b.map(k=>DB.sales.filter(s=>k.match(s.date)).reduce((a,s)=>a+Number(s.total||0),0)),out=b.map(k=>DB.purchases.filter(x=>k.match(x.date)).reduce((a,x)=>a+Number(x.total||0),0)+DB.expenses.filter(x=>k.match(x.date)).reduce((a,x)=>a+Number(x.amount||0),0));return{labels:b.map(x=>x.label),revenue,out}}

function financeTabs(section){return `<div class="fin-section-tabs"><button class="${section==='overview'?'on':''}" onclick="setFinanceSection('overview')">Visão geral</button><button class="${section==='vendas'?'on':''}" onclick="setFinanceSection('vendas')">Vendas</button><button class="${section==='compras'?'on':''}" onclick="setFinanceSection('compras')">Compras / Despesas</button><button class="${section==='receber'?'on':''}" onclick="setFinanceSection('receber')">Contas a receber</button><button class="${section==='caixa'?'on':''}" onclick="setFinanceSection('caixa')">Caixa</button></div>`}
function setFinanceSection(s){window._financeSection=s;renderFinance()}
function setFinancePeriod(p){window._financePeriod=p;renderFinance()}
function renderFinance(){const period=window._financePeriod||'month',section=window._financeSection||'overview',d=financeSummary(period),pm={};d.sales.forEach(s=>pm[paymentLabel(s.payment)]=(pm[paymentLabel(s.payment)]||0)+Number(s.total||0));const cats={};d.sales.forEach(s=>s.items.forEach(i=>{const p=DB.products.find(x=>x.id===i.productId),n=i.saleCategory==='selfservice'?'Self-service':catName(p?.category||'outros');cats[n]=(cats[n]||0)+Number(i.price||0)*Number(i.qty||0)}));$('screen-financeiro').innerHTML=`<div class="subhead"><div><h1>Financeiro</h1><p>Vendas, compras, despesas, recebíveis, caixa e indicadores.</p></div><div class="fin-actions"><button class="btn gray sm" onclick="exportFinanceCSV()">${ic('download',16)} CSV</button><button class="btn primary sm" onclick="openPurchase()">${ic('plus',16)} Compra</button></div></div><div class="chips"><button class="chip ${period==='today'?'on':''}" onclick="setFinancePeriod('today')">Diário</button><button class="chip ${period==='week'?'on':''}" onclick="setFinancePeriod('week')">Semanal</button><button class="chip ${period==='month'?'on':''}" onclick="setFinancePeriod('month')">Mensal</button><button class="chip ${period==='year'?'on':''}" onclick="setFinancePeriod('year')">Anual</button></div>${financeTabs(section)}<div id="financeBody"></div>`;const h=$('financeBody');if(section==='vendas')h.innerHTML=financeSalesHTML(d,period);else if(section==='compras')h.innerHTML=financePurchasesHTML(d,period);else if(section==='receber')h.innerHTML=financeReceivablesHTML();else if(section==='caixa')h.innerHTML=financeCashHTML();else h.innerHTML=financeOverviewHTML(d,period,pm,cats)}
function financeOverviewHTML(d,period,pm,cats){const overdue=d.openRec.filter(r=>r.due<today()).reduce((a,r)=>a+Number(r.amount||0),0),ticket=d.sales.length?d.revenue/d.sales.length:0,receivable=d.openRec.reduce((a,r)=>a+Number(r.amount||0),0),resultClass=d.result>=0?'fin-positive':'fin-negative',flowClass=d.cashFlow>=0?'fin-info':'fin-negative',ws=weightedSaleStats(d.sales);return `<div class="fin-kpis finance-status"><div class="card metric fin-positive"><small>A RECEBER</small><b>${money(receivable)}</b><em>${money(overdue)} vencido</em></div><div class="card metric fin-negative"><small>A PAGAR</small><b>${money(d.openPay)}</b><em>compras e despesas pendentes</em></div><div class="card metric ${resultClass}"><small>RESULTADO ESTIMADO</small><b>${money(d.result)}</b><em>${d.revenue?Math.round(d.result/d.revenue*100):0}% após CMV, despesas e taxas</em></div><div class="card metric ${flowClass}"><small>FLUXO LÍQUIDO</small><b>${money(d.cashFlow)}</b><em>recebido menos saídas pagas</em></div></div><div class="finance-section-title"><h2>Gráficos pizza</h2><span>Distribuição das vendas</span></div><div class="finance-charts prominent"><div class="card pie-card"><div class="finance-list-head"><h3>Formas de pagamento</h3><span>Pix, crédito, débito, dinheiro e fiado</span></div>${financePie(Object.entries(pm),'Pagamentos')}</div><div class="card pie-card"><div class="finance-list-head"><h3>Vendas por categoria</h3><span>participação no faturamento</span></div>${financePie(Object.entries(cats),'Categorias')}</div></div><div class="finance-section-title"><h2>Indicadores do período</h2><span>${period==='today'?'Diário':period==='week'?'Semanal':period==='month'?'Mensal':'Anual'}</span></div><div class="fin-kpis"><div class="card metric fin-positive"><small>Faturamento bruto</small><b>${money(d.revenue)}</b><em>${d.sales.length} venda(s)</em></div><div class="card metric fin-warning"><small>Compras</small><b>${money(d.purchaseTotal)}</b><em>mercadorias e insumos</em></div><div class="card metric fin-negative"><small>Despesas</small><b>${money(d.expenseTotal)}</b><em>despesas operacionais</em></div><div class="card metric fin-purple"><small>CMV estimado</small><b>${money(d.cmv)}</b><em>custo dos itens vendidos</em></div><div class="card metric fin-info"><small>Taxas de recebimento</small><b>${money(d.paymentFees)}</b><em>crédito, débito e Pix</em></div><div class="card metric fin-warning"><small>Descontos em combos</small><b>${money(d.discounts)}</b><em>economia concedida</em></div><div class="card metric fin-dark"><small>Ticket médio</small><b>${money(ticket)}</b><em>por venda</em></div><div class="card metric fin-purple"><small>Self-service vendido</small><b>${ws.kg.toFixed(3)} kg</b><em>${ws.count} pesagem(ns) • ${money(ws.revenue)}</em></div></div><div class="finance-note">Visão gerencial: compras afetam o fluxo financeiro; o resultado estimado usa CMV + despesas + taxas configuradas de Pix/crédito/débito. Compras de estoque ainda não vendido não são tratadas como custo da venda.</div><div class="sec-head"><h2>Receitas x saídas</h2></div><div class="card">${financeTrendHTML(financeTimeline(period))}</div><div class="sec-head"><h2>Ações financeiras</h2></div><div class="cadastro-grid"><button class="cadastro-card" onclick="setFinanceSection('compras')"><div class="r-icon red">${ic('box',21)}</div><b style="color:var(--danger)">A PAGAR / COMPRAS</b><p>Registre fornecedores, reposições, custos fixos, impostos e outras saídas.</p></button><button class="cadastro-card" onclick="setFinanceSection('receber')"><div class="r-icon green">${ic('money',21)}</div><b style="color:#2F9226">A RECEBER</b><p>Controle fiado, vencimentos, atrasos e baixas de recebimentos.</p></button><button class="cadastro-card" onclick="setFinanceSection('caixa')"><div class="r-icon blue">${ic('receipt',21)}</div><b style="color:var(--info)">CAIXA</b><p>Abertura, movimentações, sangrias e fechamento do caixa físico.</p></button></div>`}
function financeSalesHTML(d,period){const ws=weightedSaleStats(d.sales);return `<div class="fin-kpis"><div class="card metric"><small>Faturamento</small><b>${money(d.revenue)}</b><em>${d.sales.length} venda(s)</em></div><div class="card metric"><small>CMV</small><b>${money(d.cmv)}</b><em>custo estimado</em></div><div class="card metric"><small>Lucro bruto</small><b>${money(d.gross)}</b><em>${d.revenue?Math.round(d.gross/d.revenue*100):0}% margem bruta</em></div><div class="card metric"><small>Taxas estimadas</small><b>${money(d.paymentFees)}</b><em>Pix, crédito e débito</em></div><div class="card metric"><small>Desconto em combos</small><b>${money(d.discounts)}</b><em>benefício concedido</em></div><div class="card metric"><small>Resultado após taxas</small><b>${money(d.gross-d.paymentFees)}</b><em>antes das despesas operacionais</em></div><div class="card metric fin-purple"><small>SELF-SERVICE</small><b>${ws.kg.toFixed(3)} kg</b><em>${ws.count} pesagem(ns) • ${money(ws.revenue)}</em></div><div class="card metric ${ws.margin>=0?'fin-positive':'fin-negative'}"><small>MARGEM SELF-SERVICE</small><b>${ws.cost>0?ws.margin.toFixed(1)+'%':'—'}</b><em>${ws.cost>0?'com custo/kg informado':'cadastre custo/kg para calcular'}</em></div></div><div class="finance-list-head"><h3>Vendas do período</h3><span>${period==='today'?'diário':period==='week'?'semanal':period==='month'?'mensal':'anual'}</span></div><div class="list">${d.sales.length?d.sales.slice().reverse().map(s=>`<div class="row"><div class="r-icon">${ic('cart',18)}</div><div class="grow"><b>Venda #${s.number}</b><p>${new Date(s.date).toLocaleString('pt-BR')} • ${paymentLabel(s.payment)}${s.payment==='dinheiro'&&s.paymentDetail?` • recebido ${money(s.paymentDetail.received)} • troco ${money(s.paymentDetail.change)}`:''}${s.items.some(i=>i.type==='weighted')?` • ${s.items.filter(i=>i.type==='weighted').length} pesagem(ns) / ${(s.items.filter(i=>i.type==='weighted').reduce((a,i)=>a+Number(i.netG||0),0)/1000).toFixed(3)} kg` function financePurchasesHTML(d){const pending=DB.purchases.filter(x=>x.status==='pending').reduce((a,x)=>a+Number(x.total||0),0)+DB.expenses.filter(x=>x.status==='pending').reduce((a,x)=>a+Number(x.amount||0),0);return `<div class="fin-actions"><button class="btn primary" onclick="openPurchase()">${ic('plus',17)} Registrar compra</button><button class="btn gray" onclick="openExpense()">${ic('plus',17)} Registrar despesa</button></div><div class="fin-kpis"><div class="card metric fin-warning"><small>Compras no período</small><b>${money(d.purchaseTotal)}</b><em>${d.purchases.length} lançamento(s)</em></div><div class="card metric fin-negative"><small>Despesas no período</small><b>${money(d.expenseTotal)}</b><em>${d.expenses.length} lançamento(s)</em></div><div class="card metric fin-negative"><small>CONTAS A PAGAR</small><b>${money(pending)}</b><em>pendências atuais</em></div></div><div class="finance-list-head"><h3>Compras</h3><span>mercadorias, insumos e reposição</span></div><div class="list">${d.purchases.length?d.purchases.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(x=>`<div class="row"><div class="r-icon ${x.status==='paid'?'green':'orange'}">${ic('box',18)}</div><div class="grow"><b>${esc(x.desc||supplierName(x.supplierId))}</b><p>${dateBR(x.date)} • ${esc(supplierName(x.supplierId))} • ${paymentLabel(x.payment)}${x.due?' • vence '+dateBR(x.due):''}</p></div><div class="right"><strong>${money(x.total)}</strong><span class="badge ${x.status==='paid'?'green':''}">${x.status==='paid'?'PAGO':'PENDENTE'}</span>${x.status!=='paid'?`<button class="btn green sm" style="margin-top:5px" onclick="markPurchasePaid('${x.id}')">Baixar</button>`:''}</div></div>`).join(''):'<div class="empty"><b>Nenhuma compra registrada</b></div>'}</div><div class="finance-list-head"><h3>Despesas</h3><span>custos operacionais e fiscais</span></div><div class="list">${d.expenses.length?d.expenses.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(x=>`<div class="row"><div class="r-icon ${x.status==='paid'?'green':'red'}">${ic('receipt',18)}</div><div class="grow"><b>${esc(x.desc)}</b><p>${dateBR(x.date)} • ${esc(x.category)} • ${paymentLabel(x.payment)}${x.due?' • vence '+dateBR(x.due):''}</p></div><div class="right"><strong>${money(x.amount)}</strong><span class="badge ${x.status==='paid'?'green':''}">${x.status==='paid'?'PAGO':'PENDENTE'}</span>${x.status!=='paid'?`<button class="btn green sm" style="margin-top:5px" onclick="markExpensePaid('${x.id}')">Baixar</button>`:''}</div></div>`).join(''):'<div class="empty"><b>Nenhuma despesa registrada</b></div>'}</div>`}
function financeReceivablesHTML(){const open=DB.receivables.filter(r=>r.status==='open'),over=open.filter(r=>r.due<today());return `<div class="fin-kpis"><div class="card metric fin-positive"><small>A RECEBER</small><b>${money(open.reduce((a,r)=>a+Number(r.amount||0),0))}</b><em>${open.length} cobrança(s)</em></div><div class="card metric fin-negative"><small>ATRASADO</small><b>${money(over.reduce((a,r)=>a+Number(r.amount||0),0))}</b><em>${over.length} vencida(s)</em></div><div class="card metric fin-info"><small>RECEBIDO NO MÊS</small><b>${money(DB.receivables.filter(r=>r.status==='paid'&&r.paidAt&&ymd(r.paidAt).slice(0,7)===today().slice(0,7)).reduce((a,r)=>a+Number(r.amount||0),0))}</b><em>baixas realizadas</em></div></div><div class="finance-list-head"><h3>Cobranças em aberto</h3><span>vendas fiado</span></div><div class="list">${open.length?open.sort((a,b)=>a.due.localeCompare(b.due)).map(r=>`<div class="row"><div class="r-icon ${r.due<today()?'red':'orange'}">${ic('money',19)}</div><div class="grow"><b>${esc(customerName(r.customerId))}</b><p>Vence ${dateBR(r.due)} • Venda #${DB.sales.find(s=>s.id===r.saleId)?.number||'—'}</p></div><div class="right"><strong>${money(r.amount)}</strong><button class="btn green sm" style="margin-top:5px" onclick="openReceive('${r.id}')">Receber</button></div></div>`).join(''):'<div class="empty"><b>Nenhuma cobrança pendente</b></div>'}</div>`}
function financeCashHTML(){const open=cashOpen(),moves=open?DB.cashMoves.filter(m=>m.sessionId===open.id):[],sales=moves.filter(m=>m.type==='sale').reduce((a,m)=>a+Number(m.amount||0),0),cashSales=moves.filter(m=>m.type==='sale'&&m.payment==='dinheiro').reduce((a,m)=>a+Number(m.amount||0),0),ins=moves.filter(m=>m.type==='in').reduce((a,m)=>a+Number(m.amount||0),0),outs=moves.filter(m=>m.type==='out').reduce((a,m)=>a+Number(m.amount||0),0),balance=(open?Number(open.opening||0):0)+cashSales+ins-outs;return `<div class="subhead"><div><h1 style="font-size:18px">Caixa físico</h1><p>${open?'Aberto desde '+new Date(open.openedAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'Nenhum caixa aberto'}</p></div>${open?`<button class="btn danger sm" onclick="closeCashModal()">Fechar caixa</button>`:`<button class="btn green sm" onclick="openCashModal()">Abrir caixa</button>`}</div><div class="fin-kpis"><div class="card metric fin-info"><small>SALDO FÍSICO</small><b>${money(balance)}</b><em>abertura + dinheiro + entradas − saídas</em></div><div class="card metric fin-positive"><small>VENDAS DA SESSÃO</small><b>${money(sales)}</b><em>todas as formas</em></div><div class="card metric fin-negative"><small>SAÍDAS DE CAIXA</small><b>${money(outs)}</b><em>sangrias e pagamentos em dinheiro</em></div></div>${open?`<div class="fin-actions" style="margin-top:12px"><button class="btn gray" onclick="cashMoveModal('in')">Entrada</button><button class="btn gray" onclick="cashMoveModal('out')">Saída / Sangria</button></div><div class="finance-list-head"><h3>Movimentações</h3><span>sessão atual</span></div><div class="list">${moves.slice().reverse().map(m=>`<div class="row"><div class="r-icon ${m.type==='out'?'red':'green'}">${ic(m.type==='sale'?'cart':'money',18)}</div><div class="grow"><b>${esc(m.desc||m.type)}</b><p>${new Date(m.date).toLocaleString('pt-BR')} • ${paymentLabel(m.payment||'')}</p></div><div class="right"><strong>${m.type==='out'?'-':'+'}${money(m.amount)}</strong></div></div>`).join('')||'<div class="empty"><b>Sem movimentações</b></div>'}</div>`:''}`}
function openPurchase(){showSheet('Registrar compra',`<div class="grid2"><div class="field"><label>Data</label><input class="input" id="purDate" type="date" value="${today()}"></div><div class="field"><label>Fornecedor</label><select class="input" id="purSupplier"><option value="">Sem fornecedor</option>${DB.suppliers.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div></div><div class="grid2"><div class="field"><label>Tipo</label><select class="input" id="purCategory"><option>Mercadorias</option><option>Insumos</option><option>Embalagens</option><option>Equipamentos</option><option>Outros</option></select></div><div class="field"><label>Forma de pagamento</label><select class="input" id="purPayment"><option value="pix">Pix</option><option value="credito">Crédito</option><option value="debito">Débito</option><option value="dinheiro">Dinheiro</option><option value="boleto">Boleto</option><option value="prazo">A prazo</option></select></div></div><div class="field"><label>Descrição / documento</label><input class="input" id="purDesc" placeholder="Ex.: Polpa de açaí NF 1234"></div><div class="grid2"><div class="field"><label>Status</label><select class="input" id="purStatus" onchange="$('purDueWrap').style.display=this.value==='pending'?'block':'none'"><option value="paid">Pago</option><option value="pending">Pendente</option></select></div><div class="field" id="purDueWrap" style="display:none"><label>Vencimento</label><input class="input" id="purDue" type="date"></div></div><div class="install-note" style="margin-bottom:12px">Opcional: vincule a compra a um produto para dar entrada automática no estoque e atualizar o custo unitário.</div><div class="grid2"><div class="field"><label>Produto (opcional)</label><select class="input" id="purProduct" onchange="syncPurchaseTotal()"><option value="">Não vincular</option>${DB.products.filter(p=>!p.archived&&p.active).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Quantidade</label><input class="input" id="purQty" type="number" step="0.01" value="0" oninput="syncPurchaseTotal()"></div></div><div class="grid2"><div class="field"><label>Custo unitário</label><input class="input" id="purUnitCost" type="number" step="0.01" value="0" oninput="syncPurchaseTotal()"></div><div class="field"><label>Total da compra</label><input class="input" id="purTotal" type="number" step="0.01" value="0"></div></div><label style="display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;margin-top:2px"><input id="purRestock" type="checkbox" checked style="width:18px;height:18px"> Dar entrada no estoque quando houver produto e quantidade</label>`,`<button class="btn gray" onclick="closeSheet()">Cancelar</button><button class="btn green" onclick="savePurchase()">Salvar compra</button>`)}
function syncPurchaseTotal(){const q=Number($('purQty')?.value||0),u=Number($('purUnitCost')?.value||0),t=$('purTotal');if(t&&q>0&&u>0)t.value=(q*u).toFixed(2)}
async function savePurchase(){const date=$('purDate').value||today(),total=Number($('purTotal').value),status=$('purStatus').value,productId=$('purProduct').value,qty=Number($('purQty').value||0),unitCost=Number($('purUnitCost').value||0);if(!isFinite(total)||total<=0){toast('Informe o valor total da compra.');return}const x={id:uid(),date,supplierId:$('purSupplier').value,category:$('purCategory').value,desc:$('purDesc').value.trim()||'Compra',payment:$('purPayment').value,status,due:status==='pending'?$('purDue').value:'',total,productId,qty,unitCost,createdAt:new Date().toISOString()};DB.purchases.push(x);if(productId&&qty>0&&$('purRestock').checked){const p=DB.products.find(p=>p.id===productId);if(p){p.stock=Number(p.stock||0)+qty;if(unitCost>0)p.cost=unitCost;DB.stockMoves.push({id:uid(),productId,type:'purchase',qty,date:new Date().toISOString(),ref:x.id,note:'Compra registrada no financeiro'})}}if(status==='paid'){x.paidAt=new Date().toISOString();if(x.payment==='dinheiro')cashOutIfOpen(total,`Compra: ${x.desc}`)}await persistDB();closeSheet();toast('Compra registrada.');window._financeSection='compras';renderFinance()}
function openExpense(){showSheet('Registrar despesa',`<div class="grid2"><div class="field"><label>Data</label><input class="input" id="expDate" type="date" value="${today()}"></div><div class="field"><label>Categoria</label><select class="input" id="expCategory"><option>Aluguel</option><option>Energia</option><option>Água</option><option>Internet</option><option>Funcionários</option><option>Impostos / taxas</option><option>Marketing</option><option>Manutenção</option><option>Frete</option><option>Outros</option></select></div></div><div class="field"><label>Descrição</label><input class="input" id="expDesc" placeholder="Ex.: Conta de energia"></div><div class="grid2"><div class="field"><label>Valor</label><input class="input" id="expAmount" type="number" step="0.01"></div><div class="field"><label>Pagamento</label><select class="input" id="expPayment"><option value="pix">Pix</option><option value="credito">Crédito</option><option value="debito">Débito</option><option value="dinheiro">Dinheiro</option><option value="boleto">Boleto</option><option value="prazo">A prazo</option></select></div></div><div class="grid2"><div class="field"><label>Status</label><select class="input" id="expStatus" onchange="$('expDueWrap').style.display=this.value==='pending'?'block':'none'"><option value="paid">Pago</option><option value="pending">Pendente</option></select></div><div class="field" id="expDueWrap" style="display:none"><label>Vencimento</label><input class="input" id="expDue" type="date"></div></div>`,`<button class="btn gray" onclick="closeSheet()">Cancelar</button><button class="btn green" onclick="saveExpense()">Salvar despesa</button>`)}
async function saveExpense(){const amount=Number($('expAmount').value),status=$('expStatus').value;if(!isFinite(amount)||amount<=0||!$('expDesc').value.trim()){toast('Informe descrição e valor.');return}const x={id:uid(),date:$('expDate').value||today(),category:$('expCategory').value,desc:$('expDesc').value.trim(),amount,payment:$('expPayment').value,status,due:status==='pending'?$('expDue').value:'',createdAt:new Date().toISOString()};DB.expenses.push(x);if(status==='paid'){x.paidAt=new Date().toISOString();if(x.payment==='dinheiro')cashOutIfOpen(amount,`Despesa: ${x.desc}`)}await persistDB();closeSheet();toast('Despesa registrada.');window._financeSection='compras';renderFinance()}
function cashOutIfOpen(amount,desc){const open=cashOpen();if(open)DB.cashMoves.push({id:uid(),sessionId:open.id,type:'out',amount:Number(amount||0),desc,date:new Date().toISOString(),payment:'dinheiro'})}
async function markPurchasePaid(id){const x=DB.purchases.find(v=>v.id===id);if(!x||x.status==='paid')return;x.status='paid';x.paidAt=new Date().toISOString();if(x.payment==='dinheiro')cashOutIfOpen(x.total,`Compra: ${x.desc}`);await persistDB();toast('Compra baixada como paga.');renderFinance()}
async function markExpensePaid(id){const x=DB.expenses.find(v=>v.id===id);if(!x||x.status==='paid')return;x.status='paid';x.paidAt=new Date().toISOString();if(x.payment==='dinheiro')cashOutIfOpen(x.amount,`Despesa: ${x.desc}`);await persistDB();toast('Despesa baixada como paga.');renderFinance()}
function openReceive(id){const r=DB.receivables.find(x=>x.id===id);if(!r)return;showSheet('Receber cobrança',`<p style="font-size:13px;margin-bottom:12px"><b>${esc(customerName(r.customerId))}</b><br><span style="color:var(--muted)">${money(r.amount)} • vencimento ${dateBR(r.due)}</span></p><div class="field"><label>Forma de recebimento</label><select class="input" id="receivePayment"><option value="pix">Pix</option><option value="credito">Crédito</option><option value="debito">Débito</option><option value="dinheiro">Dinheiro</option></select></div>`,`<button class="btn gray" onclick="closeSheet()">Cancelar</button><button class="btn green" onclick="confirmReceive('${id}')">Confirmar recebimento</button>`)}

function exportFinanceCSV(){const period=window._financePeriod||'month',sales=periodSales(period),purchases=periodPurchases(period),expenses=periodExpenses(period),rows=[['Tipo','Data','Documento/Descricao','Entrada','Saida','Pagamento','Status','Itens/Pesagens']];sales.forEach(x=>{const detail=(x.items||[]).map(i=>i.type==='weighted'?`${i.name}: bruto ${Number(i.weightGrossG||0).toFixed(0)}g - tara ${Number(i.tareG||0).toFixed(0)}g = ${Number(i.netG||0).toFixed(0)}g @ ${money(i.pricePerKg)}/kg = ${money(i.price)}`:`${i.name} x${Number(i.qty||1)}`).join(' | ');rows.push(['Venda',x.date,'Venda #'+x.number,x.total,'',paymentLabel(x.payment),'Concluída',detail])});purchases.forEach(x=>rows.push(['Compra',x.date,x.desc,'',x.total,paymentLabel(x.payment),x.status==='paid'?'Pago':'Pendente','']));expenses.forEach(x=>rows.push(['Despesa',x.date,x.desc,'',x.amount,paymentLabel(x.payment),x.status==='paid'?'Pago':'Pendente','']));const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\n');downloadBlob(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),'pdvmix-financeiro-'+period+'-'+today()+'.csv')}

function renderCash(){const open=cashOpen(),moves=open?DB.cashMoves.filter(m=>m.sessionId===open.id):[],sales=moves.filter(m=>m.type==='sale').reduce((a,m)=>a+m.amount,0),cashSales=moves.filter(m=>m.type==='sale'&&m.payment==='dinheiro').reduce((a,m)=>a+m.amount,0),ins=moves.filter(m=>m.type==='in').reduce((a,m)=>a+m.amount,0),outs=moves.filter(m=>m.type==='out').reduce((a,m)=>a+m.amount,0),balance=(open?open.opening:0)+cashSales+ins-outs;$('screen-caixa').innerHTML=`<div class="subhead"><div><h1>Caixa</h1><p>${open?'Aberto desde '+new Date(open.openedAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'Nenhum caixa aberto'}</p></div>${open?`<button class="btn danger sm" onclick="closeCashModal()">Fechar caixa</button>`:`<button class="btn green sm" onclick="openCashModal()">Abrir caixa</button>`}</div><div class="cards"><div class="card metric"><small>Saldo atual</small><b>${money(balance)}</b><em>inclui abertura</em></div><div class="card metric"><small>Vendas</small><b>${money(sales)}</b><em>durante a sessão</em></div><div class="card metric"><small>Saídas</small><b>${money(outs)}</b><em>retiradas/despesas</em></div></div>${open?`<div style="display:flex;gap:8px;margin:12px 0"><button class="btn gray" style="flex:1" onclick="cashMoveModal('in')">Entrada</button><button class="btn gray" style="flex:1" onclick="cashMoveModal('out')">Saída</button></div><div class="sec-head"><h2>Movimentações</h2></div><div class="list">${moves.slice().reverse().map(m=>`<div class="row"><div class="r-icon ${m.type==='out'?'red':'green'}">${ic(m.type==='sale'?'cart':'money',18)}</div><div class="grow"><b>${esc(m.desc||m.type)}</b><p>${new Date(m.date).toLocaleString('pt-BR')} • ${esc(m.payment||'')}</p></div><div class="right"><strong>${m.type==='out'?'-':'+'}${money(m.amount)}</strong></div></div>`).join('')||'<div class="empty"><b>Sem movimentações</b></div>'}</div>`:''}`}

async function saveAdjustments(){const email=$('cfgEmail').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(email)){toast('Informe um e-mail válido.');return}DB.settings.userName=$('cfgUserName').value.trim()||'Administrador';DB.store.name=$('cfgName').value.trim()||'Minha Loja PDVMix';DB.store.cnpj=$('cfgCnpj').value.trim();DB.store.phone=$('cfgPhone').value.trim();DB.store.goal=Number($('cfgGoal').value||0);DB.settings.creditFeePct=Math.max(0,Number($('cfgCreditFee').value||0));DB.settings.debitFeePct=Math.max(0,Number($('cfgDebitFee').value||0));DB.settings.pixFeePct=Math.max(0,Number($('cfgPixFee').value||0));DB.settings.minComboMargin=Math.min(95,Math.max(0,Number($('cfgComboMargin').value||25)));const a=getAuth();if(a){a.email=email;localStorage.setItem(LS_AUTH,JSON.stringify(a))}await persistDB();$('storeNameTop').textContent=DB.store.name;toast('Ajustes salvos.')}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
async function exportBackup(){const media=await idbAll().catch(()=>({}));const pkg={app:'pdvmix',version:APP_VERSION,exportedAt:new Date().toISOString(),data:DB,media};downloadBlob(new Blob([JSON.stringify(pkg)],{type:'application/json'}),'pdvmix-backup-'+today()+'.json');localStorage.setItem('pdvmix_last_backup',today());toast('Backup exportado.');renderAdjustments()}
function importBackupPick(){const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=()=>{const f=inp.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const pkg=JSON.parse(r.result);if(pkg.app!=='pdvmix'||!pkg.data||!Array.isArray(pkg.data.products))throw new Error();window._backupPkg=pkg;showSheet('Restaurar backup?',`<p style="font-size:13px;color:var(--muted);line-height:1.6">O banco atual será substituído pelo backup de <b>${new Date(pkg.exportedAt||Date.now()).toLocaleString('pt-BR')}</b>.</p>`,`<button class="btn gray" onclick="closeSheet()">Cancelar</button><button class="btn danger" onclick="restoreBackup()">Restaurar</button>`)}catch(e){toast('Arquivo de backup inválido.')}};r.readAsText(f)};inp.click()}
async function restoreBackup(){const pkg=window._backupPkg;if(!pkg)return;DB=pkg.data;normalizeDB();await persistDB();if(pkg.media)for(const [k,v] of Object.entries(pkg.media))await idbPut(k,v).catch(()=>{});closeSheet();toast('Backup restaurado.');$('storeNameTop').textContent=DB.store.name;goTab('inicio')}
// ===== TUTORIAL GUIADO PDVMix =====
const TUT_STEPS=[
 {section:'COMEÇANDO',emo:'👋',title:'Bem-vindo ao PDVMix',body:`O PDVMix foi pensado para <b>sorveterias, lojas de açaí, lanchonetes e pequenos pontos de venda</b>.<br><br>Ele reúne <b>vendas, caixa, estoque, cardápio, clientes, fornecedores e financeiro</b> em um único aplicativo.<ul><li>Funciona como <b>PWA</b> no computador, tablet, iPhone e Android.</li><li>O núcleo do sistema continua funcionando <b>offline</b>.</li><li>Os dados ficam neste aparelho; faça <b>backup</b> regularmente.</li></ul>`,tip:'Tempo sugerido: cerca de 5 minutos. Você pode sair e continuar depois pelo menu Ajustes → Ajuda e aprendizado.'},
 {section:'COMEÇANDO',emo:'📲',title:'Instale o PDVMix como aplicativo',body:`Instalado, o PDVMix abre em tela própria, sem depender de uma aba do navegador.<br><br><b>Android / Chrome / Edge:</b> use o botão abaixo ou a opção “Instalar app” do navegador.<br><br><b>iPhone / iPad:</b> abra no Safari → toque em <b>Compartilhar</b> → <b>Adicionar à Tela de Início</b> → Adicionar.<br><br><b>Desktop:</b> Chrome ou Edge mostram a opção de instalar na barra de endereço ou no menu.`,note:'Depois de instalar, abra o PDVMix online pelo menos uma vez para atualizar o cache. Em seguida, ele poderá abrir mesmo sem internet.',action:{label:'📲 Instalar PDVMix agora',fn:'installPWA()'}},
 {section:'PRIMEIRA CONFIGURAÇÃO',emo:'⚙️',title:'Configure sua loja primeiro',body:`Em <b>Ajustes</b>, confirme os dados da loja e do usuário antes de começar.<ul><li>Nome da loja, CNPJ e telefone.</li><li>Meta diária de vendas.</li><li>Taxas médias de <b>crédito, débito e Pix</b>.</li><li>Margem mínima desejada para combos.</li></ul>Esses parâmetros alimentam os indicadores financeiros e ajudam o PDVMix a calcular resultados com mais precisão.`,tip:'Faça isso uma única vez e revise quando mudar de maquininha, taxa ou estratégia de margem.'},
 {section:'CADASTROS',emo:'🍨',title:'Cadastre e organize seus produtos',body:`Vá em <b>Cadastros → Cardápio</b> ou em <b>Estoque → Gerenciar</b>.<ul><li>Nome, categoria, unidade, marca e fornecedor.</li><li>Preço de venda e custo.</li><li>Estoque atual e estoque mínimo.</li><li>SKU / código de barras e localização.</li><li>Imagem pela <b>galeria</b> ou pela <b>câmera</b>.</li></ul>Todos os itens cadastrados podem ser editados. Produtos com histórico de venda podem ser arquivados sem apagar o passado financeiro.`,tip:'Cadastre o custo corretamente. Ele é essencial para CMV, lucro estimado e margem.'},
 {section:'ESTOQUE',emo:'📦',title:'Movimente o estoque sem perder o histórico',body:`No Estoque, use <b>Gerenciar</b> para alterar o cadastro e <b>Movimentar</b> para mexer nas quantidades.<br><br>Tipos de movimentação incluem:<ul><li>Entrada / compra.</li><li>Saída manual.</li><li>Perda, descarte ou avaria.</li><li>Uso interno.</li><li>Correção de saldo.</li></ul>Nas entradas, registre fornecedor, custo e documento quando possível. O sistema mostra o <b>saldo projetado</b> antes de salvar.`,note:'Vendas baixam o estoque automaticamente. Combos baixam os componentes que fazem parte deles.'},
 {section:'CARDÁPIO',emo:'🎁',title:'Monte combos com margem controlada',body:`Ao cadastrar um produto como <b>Combo</b>, selecione itens que já existem no cardápio e informe as quantidades.<br><br>O PDVMix compara:<ul><li>Preço dos itens vendidos separadamente.</li><li>Custo real do combo.</li><li>Desconto em <b>%</b> ou em <b>R$</b>.</li><li>Preço final, lucro bruto e margem.</li><li>Quanto ainda pode ser descontado sem cair abaixo da margem mínima configurada.</li></ul>`,tip:'Use combos para aumentar ticket médio sem conceder descontos que eliminem seu lucro.'},
 {section:'CAIXA',emo:'💵',title:'Abra o caixa antes de vender',body:`O botão <b>Caixa</b> está na barra fixa e também na tela inicial.<br><br>No início do turno:<ul><li>Abra o caixa e informe o valor inicial.</li><li>Registre entradas extras quando necessário.</li><li>Registre saídas e sangrias para manter o saldo físico coerente.</li><li>No fim do turno, conte o dinheiro e faça o fechamento.</li></ul>`,tip:'Pix, crédito e débito entram no faturamento, mas somente dinheiro altera o valor físico da gaveta.'},
 {section:'VENDAS',emo:'🛒',title:'Faça uma venda no PDV',body:`Toque em <b>Vender</b>.<ul><li>Busque o produto pelo nome ou navegue pelas categorias.</li><li>Toque no item para colocá-lo no pedido.</li><li>Ajuste as quantidades no carrinho.</li><li>Confira subtotal e total antes de finalizar.</li></ul>Ao confirmar, a venda entra no histórico financeiro e o estoque dos itens controlados é baixado automaticamente.`},
 {section:'VENDAS',emo:'⚖️',title:'Venda self-service por peso',body:`Em <b>Vender → Self-service por peso</b>, escolha a modalidade e informe o peso mostrado na balança.<br><br>O PDVMix calcula: <b>(peso bruto − tara) ÷ 1000 × preço/kg</b>.<ul><li>Se a balança já foi zerada com o pote, use tara <b>0 g</b>.</li><li>Uma mesma venda pode ter vários potes e produtos comuns.</li><li>Cada pesagem pode ser editada ou removida antes do pagamento.</li><li>Preço/kg, custo/kg e tara padrão ficam salvos por modalidade.</li></ul>O Financeiro registra o self-service como categoria própria, soma os quilos vendidos e usa o custo/kg para estimar margem.`,tip:'Exemplo: 235 g na balança − 25 g de tara = 210 g líquidos. A R$ 59,90/kg, o valor é R$ 12,58.'},
 {section:'PAGAMENTOS',emo:'💳',title:'Escolha a forma de pagamento correta',body:`O PDVMix separa as formas de pagamento para que o Financeiro fique correto:<ul><li><b>Pix</b>.</li><li><b>Crédito</b>.</li><li><b>Débito</b>.</li><li><b>Dinheiro</b>.</li><li><b>Fiado</b>.</li></ul>No cartão, Crédito e Débito são registrados separadamente e utilizam as taxas configuradas em Ajustes.`},
 {section:'PAGAMENTOS',emo:'🪙',title:'Dinheiro e cálculo automático do troco',body:`Quando selecionar <b>Dinheiro</b>, informe quanto o cliente entregou.<br><br>Exemplo:<br><b>Total da venda: R$ 14,00</b><br><b>Valor recebido: R$ 15,00</b><br><b>Troco: R$ 1,00</b><br><br>O PDVMix calcula o troco automaticamente antes de concluir a venda e também mostra o valor na confirmação final.`,tip:'Nunca registre como Dinheiro uma venda recebida via Pix ou cartão; isso afetaria a conferência do caixa.'},
 {section:'CLIENTES',emo:'👥',title:'Clientes e vendas fiado',body:`Em <b>Cadastros → Clientes</b>, salve os dados dos seus compradores recorrentes.<br><br>Ao usar a forma de pagamento <b>Fiado</b>, selecione um cliente e informe o vencimento. O PDVMix cria automaticamente uma <b>Conta a Receber</b> dentro do Financeiro.`,note:'Quando o cliente pagar, dê baixa na conta e informe se recebeu em Pix, Crédito, Débito ou Dinheiro.'},
 {section:'FORNECEDORES',emo:'🚚',title:'Fornecedores, compras e reposição',body:`Cadastre fornecedores em <b>Cadastros → Fornecedores</b>.<br><br>No <b>Financeiro → Compras</b>, registre mercadorias, insumos, embalagens, equipamentos e outros gastos de compra. Você pode vincular a compra a um produto para:<ul><li>Dar entrada no estoque.</li><li>Registrar quantidade.</li><li>Atualizar o custo unitário.</li><li>Controlar se a compra foi paga ou ficou pendente.</li></ul>`},
 {section:'FINANCEIRO',emo:'📊',title:'Leia o Financeiro como um painel de gestão',body:`No <b>Financeiro</b>, filtre por <b>dia, semana, mês ou ano</b> e acompanhe os principais indicadores.<ul><li><b style="color:#218739">A RECEBER</b> — valores que ainda entrarão.</li><li><b style="color:#C43D3D">A PAGAR</b> — compras e despesas pendentes.</li><li>Faturamento, compras, despesas, CMV e taxas.</li><li>Resultado estimado, margem e fluxo líquido.</li><li>Ticket médio e descontos concedidos.</li></ul>`,tip:'O Financeiro é gerencial. Obrigações fiscais oficiais como NFC-e/NF-e e escrituração tributária exigem um módulo fiscal específico.'},
 {section:'FINANCEIRO',emo:'🥧',title:'Use os gráficos para entender suas vendas',body:`Na <b>Visão Geral do Financeiro</b>, os gráficos pizza ajudam a enxergar a composição das vendas.<ul><li><b>Formas de pagamento:</b> Pix, Crédito, Débito, Dinheiro e Fiado.</li><li><b>Vendas por categoria:</b> Açaí, Sorvetes, Bebidas, Salgados, Combos, Self-service e demais categorias.</li></ul>Também há comparação de receitas e saídas para acompanhar a evolução do negócio.`,note:'Sem movimentação, os gráficos permanecem visíveis indicando que ainda não há dados suficientes.'},
 {section:'SEGURANÇA',emo:'💾',title:'Backup é obrigatório para proteger seu histórico',body:`O PDVMix é <b>offline-first</b>: banco, registros e imagens são armazenados localmente neste aparelho.<br><br>Em <b>Ajustes → Backup e dados</b>:<ul><li>Exporte um backup regularmente.</li><li>Guarde o arquivo em local seguro.</li><li>Use Importar backup para restaurar em outro aparelho.</li></ul>`,tip:'Desktop, tablet e celular não sincronizam automaticamente entre si nesta versão. Para levar os dados de um aparelho a outro, utilize o backup.'},
 {section:'FINALIZAÇÃO',emo:'✅',title:'Checklist para começar a operar',body:`Antes da primeira venda real, confira:<ul><li>Dados da loja e taxas financeiras preenchidos.</li><li>Produtos, custos, preços e estoque revisados.</li><li>Fornecedores principais cadastrados.</li><li>Combos revisados e com margem segura.</li><li>Caixa aberto.</li><li>Uma venda de teste realizada.</li><li>Financeiro conferido.</li><li>Primeiro backup exportado.</li><li>PDVMix instalado no aparelho.</li></ul><br>Pronto: você já conhece o fluxo principal do PDVMix.`,note:'Você pode rever este tutorial ou abrir diretamente um assunto em Ajustes → Ajuda e aprendizado.',action:{label:'📲 Instalar / confirmar instalação',fn:'installPWA()'}}
];
function maybeStartTutorial(){if(!localStorage.getItem(TUT_DONE_KEY)&&!document.querySelector('.modal')){const step=parseInt(localStorage.getItem(TUT_STEP_KEY)||'0',10)||0;openTutorial(Math.min(step,TUT_STEPS.length-1));}}
function openTutorial(step=0){step=Math.max(0,Math.min(Number(step)||0,TUT_STEPS.length-1));localStorage.setItem(TUT_STEP_KEY,String(step));const t=TUT_STEPS[step],last=step===TUT_STEPS.length-1,pct=Math.round(((step+1)/TUT_STEPS.length)*100);const extra=t.tip?`<div class="tut-tip">💡 ${t.tip}</div>`:t.note?`<div class="tut-note">✓ ${t.note}</div>`:'';const action=t.action?`<button class="btn green block" style="margin-top:12px" onclick="${t.action.fn}">${t.action.label}</button>`:'';showSheet('Tutorial PDVMix',`<div class="tut-hero"><div class="tut-emo">${t.emo}</div><div><div class="tut-kicker">${t.section}</div><div class="tut-title">${t.title}</div></div></div><div class="tut-progress"><i style="width:${pct}%"></i></div><div class="tut-count"><span>Etapa ${step+1} de ${TUT_STEPS.length}</span><button class="linkbtn" onclick="openTutorialIndex()">Ver índice</button></div><div class="tut-body">${t.body}</div>${extra}${action}`,`${step>0?`<button class="btn gray" onclick="openTutorial(${step-1})">‹ Anterior</button>`:`<button class="btn gray" onclick="finishTutorial(true)">Pular</button>`}<button class="btn primary" onclick="${last?'finishTutorial(false)':`openTutorial(${step+1})`}">${last?'✓ Concluir':'Próximo ›'}</button>`)}
function finishTutorial(skipped=false){localStorage.setItem(TUT_DONE_KEY,'1');localStorage.removeItem(TUT_STEP_KEY);closeSheet();toast(skipped?'Tutorial fechado. Você pode rever em Ajustes.':'Tutorial concluído. Bom trabalho!');}
function openTutorialIndex(){const groups=TUT_STEPS.map((t,i)=>`<button onclick="openTutorial(${i})"><span class="n">${i+1}</span><span class="tx"><b>${t.emo} ${t.title}</b><span>${t.section}</span></span></button>`).join('');showSheet('Índice do tutorial',`<div class="tut-body" style="margin-bottom:12px">Escolha um assunto para ir direto à explicação. Seu progresso fica salvo neste aparelho.</div><div class="tut-index">${groups}</div>`,`<button class="btn gray" onclick="closeSheet()">Fechar</button><button class="btn primary" onclick="openTutorial(parseInt(localStorage.getItem(TUT_STEP_KEY)||'0',10)||0)">Retomar</button>`)}
function showSheet(title,body,foot=''){ $('modals').innerHTML=`<div class="modal" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="mh"><h2>${title}</h2><button class="x" onclick="closeSheet()">✕</button></div><div class="mb">${body}</div>${foot?`<div class="mf">${foot}</div>`:''}</div></div>` }function closeSheet(){$('modals').innerHTML=''}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e});function installPWA(){if(matchMedia('(display-mode: standalone)').matches){toast('O PDVMix já está instalado.');return}if(deferredInstallPrompt){deferredInstallPrompt.prompt();deferredInstallPrompt.userChoice.finally(()=>deferredInstallPrompt=null)}else toast('No navegador, use “Instalar app” ou “Adicionar à tela inicial”.')}
function updateOnline(){document.body.classList.toggle('offline',!navigator.onLine)}window.addEventListener('online',updateOnline);window.addEventListener('offline',updateOnline);updateOnline();
window.addEventListener('DOMContentLoaded',()=>{setTimeout(()=>{$('splash').classList.add('hidden');showAuth()},650)});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
