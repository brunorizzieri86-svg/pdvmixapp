function makeBusinessDB(type='acai',name='Meu negócio'){
 const d=defaultDB();d.businessType=type;d.store.name=name||'Meu negócio';
 if(type==='meals'){d.products=[];d.categories=[{id:'marmita',name:'Marmitas'}];d.store.goal=0;d.settings.selfServiceProfiles=[];}

}

function syncWorkspaceFromDB(){if(!ACCOUNT||!DB)return;let w=activeWorkspace();if(!w){w={id:ACTIVE_WORKSPACE_ID||uid(),name:DB.store?.name||'Meu negócio',businessType:DB.businessType||'acai',createdAt:new Date().toISOString(),data:DB};ACCOUNT.workspaces=ACCOUNT.workspaces||[];ACCOUNT.workspaces.push(w);ACTIVE_WORKSPACE_ID=w.id}w.data=DB;w.name=DB.store?.name||w.name||'Meu negócio';w.businessType=DB.businessType||w.businessType||'acai';ACCOUNT.activeWorkspaceId=w.id;ACCOUNT.version=APP_VERSION}
function normalizeAccountPayload(payload){
 if(payload&&Array.isArray(payload.workspaces)){
   ACCOUNT=payload;ACCOUNT.schema='pdvmix-account-v1';ACCOUNT.version=APP_VERSION;ACCOUNT.openMode=ACCOUNT.openMode||'last';
   ACCOUNT.workspaces=ACCOUNT.workspaces.filter(w=>w&&w.data);
 }else{
   const legacy=(payload&&typeof payload==='object')?payload:defaultDB(),wid=uid();
   ACCOUNT={schema:'pdvmix-account-v1',version:APP_VERSION,activeWorkspaceId:wid,openMode:'last',createdAt:new Date().toISOString(),workspaces:[{id:wid,name:legacy.store?.name||'Meu negócio',businessType:legacy.businessType||'acai',createdAt:new Date().toISOString(),data:legacy}]};
 }
 if(!ACCOUNT.workspaces.length){const d=makeBusinessDB('acai','Meu negócio'),wid=uid();ACCOUNT.workspaces.push({id:wid,name:d.store.name,businessType:d.businessType,createdAt:new Date().toISOString(),data:d});ACCOUNT.activeWorkspaceId=wid}

}
function workspaceMediaKey(base){return ACTIVE_WORKSPACE_ID?`ws:${ACTIVE_WORKSPACE_ID}:${base}`:base}

async function migrateLegacyBrandLogo(){if(!ACTIVE_WORKSPACE_ID)return;const scoped=await idbGet(workspaceMediaKey('brand:logo')).catch(()=>null);if(scoped)return;const legacy=await idbGet('brand:logo').catch(()=>null);if(legacy)await idbPut(workspaceMediaKey('brand:logo'),legacy).catch(()=>{})}

function normalizeDB(){

function b64e(u8){return btoa(String.fromCharCode(...u8))}function b64d(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function deriveKey(pass,salt){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function makeCheck(key){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode('pdvmix-ok'));return{iv:b64e(iv),ct:b64e(new Uint8Array(ct))}}
async function verifyKey(key,check){try{const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(check.iv)},key,b64d(check.ct));return new TextDecoder().decode(pt)==='pdvmix-ok'}catch(e){return false}}

let saveTimer=null;function save(){clearTimeout(saveTimer);saveTimer=setTimeout(persistDB,120)}
async function persistDB(){if(!DB)return;syncWorkspaceFromDB();const payload=ACCOUNT||DB,raw=JSON.stringify(payload);if(_cryptoKey){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},_cryptoKey,new TextEncoder().encode(raw));localStorage.setItem(LS_KEY,JSON.stringify({encrypted:true,iv:b64e(iv),ct:b64e(new Uint8Array(ct))}))}else localStorage.setItem(LS_KEY,raw)}
async function loadDBWithKey(key){const raw=localStorage.getItem(LS_KEY);if(!raw){normalizeAccountPayload(defaultDB());return}const parsed=JSON.parse(raw);let payload;if(parsed&&parsed.encrypted){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(parsed.iv)},key,b64d(parsed.ct));payload=JSON.parse(new TextDecoder().decode(pt))}else payload=parsed;normalizeAccountPayload(payload)}
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open(IDB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore('media');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbPut(k,v){const db=await idbOpen();return new Promise((res,rej)=>{const tx=db.transaction('media','readwrite');tx.objectStore('media').put(v,k);tx.oncomplete=()=>res(true);tx.onerror=()=>rej(tx.error)})}
async function idbGet(k){const db=await idbOpen();return new Promise((res,rej)=>{const tx=db.transaction('media','readonly');const r=tx.objectStore('media').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbDel(k){const db=await idbOpen();return new Promise((res,rej)=>{const tx=db.transaction('media','readwrite');tx.objectStore('media').delete(k);tx.oncomplete=()=>res(true);tx.onerror=()=>rej(tx.error)})}
async function idbAll(){const db=await idbOpen();return new Promise((res,rej)=>{const out={};const tx=db.transaction('media','readonly');const st=tx.objectStore('media');const r=st.openCursor();r.onsuccess=e=>{const c=e.target.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};r.onerror=()=>rej(r.error)})}

function onlyDigits(v){return String(v??'').replace(/\D/g,'')}
function maskPhone(v){let d=onlyDigits(v).slice(0,11);if(!d)return'';if(d.length<=2)return '('+d;if(d.length<=6)return `(${d.slice(0,2)}) ${d.slice(2)}`;if(d.length<=10)return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`}
function maskDoc(v){let d=onlyDigits(v).slice(0,14);if(d.length<=11){d=d.replace(/^(\d{3})(\d)/,'$1.$2').replace(/^(\d{3})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1-$2');return d}return d.replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\/\d{4})(\d)/,'$1-$2')}
function maskCEP(v){let d=onlyDigits(v).slice(0,8);return d.length>5?d.slice(0,5)+'-'+d.slice(5):d}
function parseMoneyInput(v){if(typeof v==='number')return isFinite(v)?v:0;let x=String(v??'').trim().replace(/R\$\s?/g,'').replace(/\s/g,'');if(!x)return 0;if(x.includes(',')&&x.includes('.'))x=x.replace(/\./g,'').replace(',','.');else if(x.includes(','))x=x.replace(',','.');const n=Number(x);return isFinite(n)?n:0}
function moneyFieldValue(v){return 'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function formatMoneyInput(el){if(!el)return;el.value=moneyFieldValue(parseMoneyInput(el.value));}
function prepareMoneyInput(el){if(!el)return;let n=parseMoneyInput(el.value);el.value=n?String(n).replace('.',','):'';setTimeout(()=>{try{el.select()}catch(e){}},0)}
function setupMoneyField(id){const el=$(id);if(!el)return;el.type='text';el.inputMode='decimal';if(!el.dataset.moneyMask){el.dataset.moneyMask='1';el.addEventListener('focus',()=>prepareMoneyInput(el));el.addEventListener('blur',()=>formatMoneyInput(el))}if(document.activeElement!==el&&el.value!==''&&el.value!=null)formatMoneyInput(el)}
function parsePercentInput(v){let x=String(v??'').replace(/%/g,'').trim();return Math.max(0,parseMoneyInput(x))}
function percentFieldValue(v){return Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:2})+'%'}
function preparePercentInput(el){if(!el)return;const n=parsePercentInput(el.value);el.value=String(n||0).replace('.',',');setTimeout(()=>{try{el.select()}catch(e){}},0)}
function formatPercentInput(el){if(!el)return;el.value=percentFieldValue(parsePercentInput(el.value))}
function setupPercentField(id){const el=$(id);if(!el)return;el.type='text';el.inputMode='decimal';if(!el.dataset.percentMask){el.dataset.percentMask='1';el.addEventListener('focus',()=>preparePercentInput(el));el.addEventListener('blur',()=>formatPercentInput(el))}if(document.activeElement!==el&&el.value!==''&&el.value!=null)formatPercentInput(el)}
function setupDynamicDiscountField(id,typeGetter){const el=$(id);if(!el)return;el.type='text';el.inputMode='decimal';if(!el.dataset.dynamicDiscountMask){el.dataset.dynamicDiscountMask='1';el.addEventListener('focus',()=>{typeGetter()==='percent'?preparePercentInput(el):prepareMoneyInput(el)});el.addEventListener('blur',()=>{typeGetter()==='percent'?formatPercentInput(el):formatMoneyInput(el)})}if(document.activeElement!==el){typeGetter()==='percent'?formatPercentInput(el):formatMoneyInput(el)}}

async function lookupCEP(prefix='c'){const el=$(prefix+'Zip'),raw=onlyDigits(el?.value);if(raw.length!==8){toast('Digite um CEP com 8 números.');return}const status=$(prefix+'CepStatus');if(status){status.className='field-status';status.textContent='Buscando endereço...'}if(!navigator.onLine){if(status){status.className='field-status err';status.textContent='Sem internet. Preencha o endereço manualmente.'}return}try{const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),6500);const r=await fetch(`https://viacep.com.br/ws/${raw}/json/`,{signal:ctrl.signal});clearTimeout(t);if(!r.ok)throw new Error('cep');const d=await r.json();if(d.erro)throw new Error('cep');if($(prefix+'Street'))$(prefix+'Street').value=d.logradouro||'';if($(prefix+'Neighborhood'))$(prefix+'Neighborhood').value=d.bairro||'';if($(prefix+'City'))$(prefix+'City').value=d.localidade||'';if($(prefix+'State'))$(prefix+'State').value=d.uf||'';if(status){status.className='field-status ok';status.textContent='Endereço encontrado. Confira número e complemento.'}$(prefix+'Number')?.focus()}catch(e){if(status){status.className='field-status err';status.textContent='Não foi possível consultar o CEP. Preencha manualmente.'}}}

bel id="setupStoreLabel">Nome da empresa</label><input class="input" id="setupStore" placeholder="Ex.: Minha empresa"></div><div class="field"><label>E-mail administrador</label><input class="input" id="setupEmail" type="email" placeholder="voce@empresa.com"></div><div class="field"><label>Senha</label><input class="input" id="setupPass" type="password" placeholder="Mín. 6 caracteres"></div><button class="btn primary block" id="setupStart" onclick="doSetup()" disabled>Criar acesso e iniciar</button></div>`}</div>`}
function selectBusinessType(type){setupBusinessType=type;document.querySelectorAll('.business-card').forEach(x=>x.classList.remove('on'));const meal=type==='meals';$('authScreen')?.classList.toggle('meal-auth',meal);$(meal?'bizMeal':'bizAcai')?.classList.add('on');const setup=$('setupFields');setup?.classList.remove('disabled');if($('setupStart'))$('setupStart').disabled=false;if($('setupStoreLabel'))$('setupStoreLabel').textContent=meal?'Nome da marca / empresa':'Nome da loja';if($('setupStore'))$('setupStore').placeholder=meal?'Ex.: Sabor da Semana':'Ex.: Cantinho do Açaí';if($('setupBusinessHint'))$('setupBusinessHint').innerHTML=meal?'🍱 <b>Marmitas:</b> sem frente de caixa. O foco será pedidos, clientes, produção, entregas, custos e resultado do negócio.':'🍧 <b>Açaíteria:</b> mantém o PDV completo com frente de caixa, estoque, self-service por peso e Financeiro.';if(setup&&(window.innerWidth<=620||window.innerHeight<=760)){setTimeout(()=>setup.scrollIntoView({behavior:'smooth',block:'start'}),120);}}
async function doSetup(){const store=$('setupStore')?.value.trim(),email=$('setupEmail')?.value.trim().toLowerCase(),pass=$('setupPass')?.value||'',type=setupBusinessType;if(!type){toast('Escolha o modelo do negócio.');return}if(!store||!/\S+@\S+\.\S+/.test(email)||pass.length<6){toast('Preencha empresa, e-mail válido e senha com pelo menos 6 caracteres.');return}if(!crypto.subtle){toast('Abra pelo HTTPS/localhost para usar a proteção do banco.');return}const salt=crypto.getRandomValues(new Uint8Array(16));const key=await deriveKey(pass,salt);const check=await makeCheck(key);localStorage.setItem(LS_AUTH,JSON.stringify({email,salt:b64e(salt),check,createdAt:Date.now()}));setBusinessHint(type);_cryptoKey=key;const d=makeBusinessDB(type,store),wid=uid();ACCOUNT={schema:'pdvmix-account-v1',version:APP_VERSION,activeWorkspaceId:wid,openMode:'last',createdAt:new Date().toISOString(),workspaces:[{id:wid,name:store,businessType:type,createdAt:new Date().toISOString(),data:d}]};ACTIVE_WORKSPACE_ID=wid;DB=d;await persistDB();$('authScreen').classList.add('hidden');enterApp()}
async function doLogin(){const a=getAuth(),email=$('authEmail').value.trim().toLowerCase(),pass=$('authPass').value;if(!a||email!==String(a.email).toLowerCase()){toast('E-mail ou senha inválidos.');return}try{const key=await deriveKey(pass,b64d(a.salt));if(!(await verifyKey(key,a.check))){toast('E-mail ou senha inválidos.');return}_cryptoKey=key;await loadDBWithKey(key);await migrateLegacyBrandLogo();setBusinessHint(DB.businessType);$('authScreen').classList.add('hidden');enterApp();if((ACCOUNT?.workspaces?.length||0)>1&&ACCOUNT.openMode==='choose')setTimeout(()=>openWorkspaceSwitcher(true),180)}catch(e){console.error(e);toast('Não foi possível abrir o banco local.')}}
function forgotAccess(){showSheet('Recuperação de acesso',`<div class="install-note">A senha não é enviada para servidor algum. Como o banco é local e criptografado, ela não pode ser recuperada. Use um backup para restaurar os dados em outro aparelho ou reinicie este dispositivo.</div>`,`<button class="btn gray" onclick="closeSheet()">Fechar</button>`) }
function resetDemoConfirm(){showSheet('Apagar dados deste aparelho?',`<p style="font-size:13px;color:var(--muted);line-height:1.6">Isso remove o banco, o acesso e as imagens locais. Use apenas se realmente quiser recomeçar.</p>`,`<button class="btn gray" onclick="closeSheet()">Cancelar</button><button class="btn danger" onclick="wipeAll()">Apagar tudo</button>`)}
async function wipeAll(){localStorage.removeItem(LS_KEY);localStorage.removeItem(LS_AUTH);localStorage.removeItem(LS_BUSINESS_HINT);try{indexedDB.deleteDatabase(IDB_NAME)}catch(e){}location.reload()}
function logout(){if(DB?.businessType)setBusinessHint(DB.businessType);_cryptoKey=null;DB=null;ACCOUNT=null;ACTIVE_WORKSPACE_ID='';cart=[];cashReceived='';$('app').classList.add('hidden');$('mainNav').classList.add('hidden');showAuth()}

function workspaceCardHTML(w){const active=w.id===ACTIVE_WORKSPACE_ID;return `<button class="workspace-card ${w.businessType==='meals'?'meals':''} ${active?'active':''}" onclick="switchWorkspace('${w.id}')"><div class="wi">${workspaceTypeIcon(w.businessType)}</div><div><b>${esc(w.data?.store?.name||w.name||'Meu negócio')}</b><p>${workspaceTypeLabel(w.businessType)}</p></div>${active?'<span class="current">ATUAL</span>':'<span style="font-size:18px;color:var(--muted)">›</span>'}</button>`}
function openWorkspaceSwitcher(force=false){if(!ACCOUNT)return;const n=ACCOUNT.workspaces?.length||0;showSheet(force?'Escolha o negócio':'Meus negócios e módulos',`<div class="workspace-note">Uma única conta PDVMix pode ter vários negócios. Cada negócio mantém seus próprios produtos, clientes, estoque, pedidos e financeiro.</div><div class="workspace-list">${ACCOUNT.workspaces.map(workspaceCardHTML).join('')}</div><div class="workspace-actions"><button class="btn primary" onclick="openAddWorkspace()">+ Adicionar negócio</button><button class="btn gray" onclick="showModuleGallery()">Conhecer outros módulos</button></div>${n>1?`<div class="field" style="margin-top:12px"><label>Ao abrir o aplicativo</label><select class="input" onchange="setAccountOpenMode(this.value)"><option value="last" ${ACCOUNT.openMode==='last'?'selected':''}>Entrar no último negócio usado</option><option value="choose" ${ACCOUNT.openMode==='choose'?'selected':''}>Sempre perguntar qual negócio abrir</option></select></div>`:''}`)}
async function switchWorkspace(id){if(!ACCOUNT||id===ACTIVE_WORKSPACE_ID){closeSheet();return}await persistDB();const w=ACCOUNT.workspaces.find(x=>x.id===id);if(!w)return;ACTIVE_WORKSPACE_ID=w.id;ACCOUNT.activeWorkspaceId=w.id;DB=w.data;normalizeDB();syncWorkspaceFromDB();setBusinessHint(DB.businessType);await persistDB();closeSheet();cart=[];selectedCustomer='';cashReceived='';window._mealSection='overview';window._mealFinSection='overview';applyBusinessMode();renderMainNav();goTab('inicio');toast(`Agora você está em ${DB.store.name}.`)}
async function setAccountOpenMode(mode){if(!ACCOUNT)return;ACCOUNT.openMode=mode==='choose'?'choose':'last';await persistDB();toast(ACCOUNT.openMode==='choose'?'O PDVMix perguntará qual negócio abrir.':'O PDVMix abrirá o último negócio usado.')}
function openAddWorkspace(){showSheet('Adicionar novo negócio',`<div class="module-gallery"><button class="module-preview" onclick="openNewWorkspaceForm('acai')"><div class="mh2"><div class="mi">🍧</div><div><h3>Açaíteria / Sorveteria / Lanchonete</h3><p>PDV, caixa, self-service, estoque, compras e financeiro.</p></div></div></button><button class="module-preview meals" onclick="openNewWorkspaceForm('meals')"><div class="mh2"><div class="mi">🍱</div><div><h3>Marmitas congeladas</h3><p>Pedidos, produção, agenda, clientes, entregas, custos e administração.</p></div></div></button></div><div class="workspace-note">Você pode criar mais de um negócio do mesmo tipo. Ex.: duas lojas de açaí ou duas marcas de marmitas.</div>`,`<button class="btn gray" onclick="closeSheet()">Cancelar</button>`)}
function openNewWorkspaceForm(type){showSheet(`Novo negócio • ${workspaceTypeLabel(type)}`,`<div class="field"><label>Nome da empresa / marca</label><input class="input" id="newWorkspaceName" placeholder="${type==='meals'?'Ex.: Bom Sabor':'Ex.: Cantinho do Açaí'}" autofocus></div><div class="workspace-note">Este negócio terá dados próprios e separados do negócio atual. O login continuará sendo o mesmo.</div>`,`<button class="btn gray" onclick="openWorkspaceSwitcher()">Voltar</button><button class="btn primary" onclick="createWorkspace('${type}')">Criar negócio</button>`)}
async function createWorkspace(type){const name=$('newWorkspaceName')?.value.trim();if(!name){toast('Informe o nome do negócio.');return}await migrateLegacyBrandLogo();await persistDB();const d=makeBusinessDB(type,name),wid=uid(),w={id:wid,name,businessType:type,createdAt:new Date().toISOString(),data:d};ACCOUNT.workspaces.push(w);ACCOUNT.activeWorkspaceId=wid;ACCOUNT.openMode=ACCOUNT.workspaces.length>1?'choose':ACCOUNT.openMode;ACTIVE_WORKSPACE_ID=wid;DB=d;setBusinessHint(type);await persistDB();closeSheet();applyBusinessMode();renderMainNav();goTab('inicio');toast(`${name} foi criado. Você pode trocar de negócio tocando no nome no topo.`)}
function showModuleGallery(){showSheet('Conhecer módulos do PDVMix',`<div class="module-gallery"><div class="module-preview"><div class="mh2"><div class="mi">🍧</div><div><h3>Açaíteria / Sorveteria / Lanchonete</h3><p>Operação rápida de balcão e frente de caixa.</p></div></div><ul><li>PDV com Pix, crédito, débito, dinheiro e fiado.</li><li>Self-service por peso e cálculo de troco.</li><li>Estoque, combos, caixa e financeiro.</li></ul><button class="btn primary sm" style="margin-top:10px" onclick="openNewWorkspaceForm('acai')">Criar negócio deste módulo</button></div><div class="module-preview meals"><div class="mh2"><div class="mi">🍱</div><div><h3>Marmitas congeladas</h3><p>Gestão e administração sem frente de caixa.</p></div></div><ul><li>Pedidos por cliente e pagamentos.</li><li>Produção, estoque pronto e agenda.</li><li>Clientes, WhatsApp, custos e financeiro.</li></ul><button class="btn primary sm" style="margin-top:10px" onclick="openNewWorkspaceForm('meals')">Criar negócio deste módulo</button></div></div><div class="workspace-note"><b>Mais módulos no futuro:</b> esta estrutura já está preparada para novos modelos sem exigir outro login.</div>`,`<button class="btn gray" onclick="openWorkspaceSwitcher()">Voltar</button>`)}
function isMealMode(){return DB?.businessType==='meals'}
function applyBusinessMode(){const meal=isMealMode();document.body.classList.toggle('meal-business',meal);document.querySelector('meta[name="theme-color"]')?.setAttribute('content',meal?'#35572B':'#4B165A');$('storeNameTop').textContent=DB.store.name||(meal?'Sua empresa':'Sua loja');loadTopBrandLogo();}
async function loadTopBrandLogo(){const img=$('topBrandImg');if(!img)return;if(isMealMode()){const custom=await getWorkspaceBrandLogo();if(custom){if(!img.dataset.pdvLogo)img.dataset.pdvLogo=img.src;img.src=custom;return}}if(img.dataset.pdvLogo)img.src=img.dataset.pdvLogo;}
function renderMainNav(){const h=$('mainNavInner');if(!h)return;if(isMealMode())h.innerHTML=`<button data-tab="inicio" onclick="goTab('inicio')"><span class="nic">${ic('home',20)}</span><span>Início</span></button><button data-tab="pedidos" onclick="goTab('pedidos')"><span class="nic">${ic('receipt',20)}</span><span>Pedidos</span></button><button data-tab="agenda" onclick="goTab('agenda')"><span class="nic">${ic('calendar',20)}</span><span>Agenda</span></button><button data-tab="marmitas" onclick="goTab('marmitas')"><span class="nic">${ic('store',20)}</span><span>Marmitas</span></button><button data-tab="clientes" onclick="goTab('clientes')"><span class="nic">${ic('users',20)}</span><span>Clientes</span></button><button data-tab="financeiro" onclick="goTab('financeiro')"><span class="nic">${ic('money',20)}</span><span>Financeiro</span></button>`;else h.innerHTML=`<button data-tab="inicio" onclick="goTab('inicio')"><span class="nic">${ic('home',20)}</span><span>Início</span></button><button data-tab="pdv" onclick="goTab('pdv')"><span class="nic">${ic('cart',20)}</span><span>Vender</span></button><button data-tab="estoque" onclick="goTab('estoque')"><span class="nic">${ic('box',20)}</span><span>Estoque</span></button><button data-tab="caixa" class="cash-nav" onclick="goTab('caixa')"><span class="nic">${ic('receipt',20)}</span><span>Caixa</span></button><button data-tab="financeiro" onclick="openFinance('overview')"><span class="nic">${ic('money',20)}</span><span>Financeiro</span></button><button data-tab="cadastros" onclick="goTab('cadastros')"><span class="nic">${ic('users',20)}</span><span>Cadastros</span></button>`;}

async function saveMealProduction(){const productId=$('mealProdProduct').value,p=DB.products.find(x=>x.id===productId),planned=Math.max(0,Number($('mealPlanned').value||0)),produced=Math.max(0,Number($('mealProduced').value||0)),date=$('mealProdDate').value||today(),expiry=$('mealExpiry').value||'',notes=$('mealProdNotes').value.trim();if(!p){toast('Selecione uma marmita.');return}if(planned<=0&&produced<=0){toast('Informe o planejado ou o produzido.');return}DB.mealProduction.push({id:uid(),productId,weekStart:weekStartDate(date),planned,produced,date,expiry,notes,createdAt:new Date().toISOString()});if(produced>0){p.stock=Number(p.stock||0)+produced;DB.stockMoves.push({id:uid(),productId:p.id,type:'production',qty:produced,date:new Date(date+'T12:00:00').toISOString(),notes,expiry})}await persistDB();closeSheet();toast('Produção registrada e estoque atualizado.');window._mealWeek=weekStartDate(date);window._mealSection='production';renderMarmitas()}

async function saveAdjustments(){const email=$('cfgEmail').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(email)){toast('Informe um e-mail válido.');return}DB.settings.userName=$('cfgUserName').value.trim()||'Administrador';DB.store.name=$('cfgName').value.trim()||'Minha Loja PDVMix';DB.store.cnpj=maskDoc($('cfgCnpj').value);DB.store.phone=maskPhone($('cfgPhone').value);DB.store.instagram=$('cfgInstagram')?.value.trim()||'';DB.store.slogan=$('cfgSlogan')?.value.trim()||'';DB.store.address=$('cfgAddress')?.value.trim()||'';DB.store.goal=parseMoneyInput($('cfgGoal').value||0);DB.settings.creditFeePct=Math.max(0,parsePercentInput($('cfgCreditFee').value||0));DB.settings.debitFeePct=Math.max(0,parsePercentInput($('cfgDebitFee').value||0));DB.settings.pixFeePct=Math.max(0,parsePercentInput($('cfgPixFee').value||0));DB.settings.minComboMargin=Math.min(95,Math.max(0,parsePercentInput($('cfgComboMargin').value||25)));const a=getAuth();if(a){a.email=email;localStorage.setItem(LS_AUTH,JSON.stringify(a))}await persistDB();$('storeNameTop').textContent=DB.store.name;toast('Ajustes salvos.')}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
async function exportBackup(){syncWorkspaceFromDB();const media=await idbAll().catch(()=>({}));const pkg={app:'pdvmix',version:APP_VERSION,exportedAt:new Date().toISOString(),account:ACCOUNT,data:DB,media};downloadBlob(new Blob([JSON.stringify(pkg)],{type:'application/json'}),'pdvmix-backup-'+today()+'.json');localStorage.setItem('pdvmix_last_backup',today());toast('Backup completo de todos os negócios exportado.');isMealMode()?renderMealAdjustments():renderAdjustments()}
function importBackupPick(){const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=()=>{const f=inp.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const pkg=JSON.parse(r.result),ok=pkg.app==='pdvmix'&&((pkg.account&&Array.isArray(pkg.account.workspaces))||(pkg.data&&Array.isArray(pkg.data.products)));if(!ok)throw new Error();window._backupPkg=pkg;const count=pkg.account?.workspaces?.length||1;showSheet('Restaurar backup?',`<p style="font-size:13px;color:var(--muted);line-height:1.6">O banco atual será substituído pelo backup de <b>${new Date(pkg.exportedAt||Date.now()).toLocaleString('pt-BR')}</b>.<br><br>Negócios no arquivo: <b>${count}</b>.</p>`,`<button class="btn gray" onclick="closeSheet()">Cancelar</button><button class="btn danger" onclick="restoreBackup()">Restaurar</button>`)}catch(e){toast('Arquivo de backup inválido.')}};r.readAsText(f)};inp.click()}
async function restoreBackup(){const pkg=window._backupPkg;if(!pkg)return;normalizeAccountPayload(pkg.account||pkg.data);await persistDB();if(pkg.media)for(const [k,v] of Object.entries(pkg.media))await idbPut(k,v).catch(()=>{});closeSheet();toast('Backup restaurado.');setBusinessHint(DB.businessType);applyBusinessMode();renderMainNav();goTab('inicio')}

const TUT_STEPS=[
 {section:'VISÃO GERAL',emo:'👋',title:'Bem-vindo ao PDVMix',body:`Este módulo foi criado para <b>açaíterias, sorveterias e lanchonetes</b> com operação de balcão.<ul><li>PDV rápido para registrar vendas.</li><li>Caixa físico separado de Pix e cartões.</li><li>Estoque, fornecedores, clientes e cardápio.</li><li>Self-service por peso e combos.</li><li>Financeiro com compras, despesas, contas a pagar e a receber.</li></ul>Uma mesma conta pode ter vários negócios separados.`,tip:'Toque no nome do negócio no topo para trocar de empresa, criar outro negócio ou conhecer outros módulos.'},
 {section:'INSTALAÇÃO',emo:'📲',title:'Instale o PDVMix no aparelho',body:`Use o PDVMix como aplicativo no <b>Desktop, Tablet, iPhone ou Android</b>.<br><br><b>Android/Chrome/Edge:</b> use “Instalar app”.<br><b>iPhone/iPad:</b> Safari → Compartilhar → Adicionar à Tela de Início.<br><b>Desktop:</b> Chrome/Edge → Instalar aplicativo.`,note:'Abra online ao menos uma vez após uma atualização para o Service Worker renovar os arquivos offline.',action:{label:'📲 Instalar PDVMix agora',fn:'installPWA()'}},
 {section:'NAVEGAÇÃO',emo:'🧭',title:'Entenda a barra inferior e os atalhos',body:`A barra fixa concentra os seis acessos usados durante a operação: <b>Início, Vender, Estoque, Caixa, Financeiro e Cadastros</b>.<br><br>O botão selecionado salta visualmente para fora da barra para você saber onde está. <b>Ajustes</b> fica no ícone de engrenagem no topo, liberando espaço e deixando os botões maiores.`},
 {section:'CONFIGURAÇÃO',emo:'⚙️',title:'Configure a loja e as taxas',body:`Em <b>Ajustes</b>, revise nome da loja, CNPJ, telefone, meta diária, taxas de crédito/débito/Pix e margem mínima de combos.<br><br>Campos financeiros usam máscara em <b>R$</b> e percentuais usam máscara em <b>%</b>. Telefone e CPF/CNPJ também são formatados automaticamente.`,tip:'As taxas são usadas no resultado gerencial. Atualize quando trocar de maquininha ou plano de recebimento.'},
 {section:'PRODUTOS',emo:'🍨',title:'Cadastre produtos completos',body:`Em <b>Cadastros → Cardápio</b> ou <b>Estoque → Gerenciar</b>, cadastre nome, categoria, unidade, fornecedor, preço, custo, estoque, mínimo, foto, SKU e código de barras.<br><br>Preço e custo usam máscara monetária brasileira. Todos os produtos podem ser editados; itens com histórico são arquivados em vez de apagar o passado.`},
 {section:'ESTOQUE',emo:'📦',title:'Controle entradas, perdas e correções',body:`Use <b>Movimentar</b> no Estoque para registrar entrada/compra, saída manual, perda, avaria, uso interno ou correção de saldo.<ul><li>Informe fornecedor e documento.</li><li>Registre o custo da entrada em R$.</li><li>Confira o saldo projetado antes de salvar.</li></ul>`},
 {section:'SELF-SERVICE',emo:'⚖️',title:'Venda açaí e sorvete por peso',body:`Cadastre uma ou mais modalidades com <b>preço/kg, custo/kg e tara padrão</b>. Na venda, informe peso bruto e tara; o PDVMix calcula peso líquido e valor automaticamente.<br><br>Você pode misturar pesagens e produtos normais no mesmo pedido.`},
 {section:'COMBOS',emo:'🎁',title:'Crie combos sem perder margem',body:`Monte combos usando produtos já cadastrados. Escolha desconto em <b>%</b> ou <b>R$</b> e defina a margem mínima desejada.<br><br>O PDVMix mostra preço avulso, custo, desconto, lucro bruto, margem e quanto ainda pode ser descontado com segurança.`},
 {section:'PDV',emo:'🛒',title:'Faça uma venda de balcão',body:`Em <b>Vender</b>, toque nos produtos, ajuste quantidades e confira o pedido. Escolha <b>Pix, Crédito, Débito, Dinheiro ou Fiado</b>.<br><br>Ao finalizar, o estoque é baixado automaticamente e a venda entra no Financeiro.`},
 {section:'DINHEIRO',emo:'💵',title:'Calcule o troco automaticamente',body:`Ao selecionar <b>Dinheiro</b>, informe o valor entregue pelo cliente. O campo usa máscara em R$ e o PDVMix calcula o troco na hora.<br><br>Os atalhos de valor exato e notas comuns agilizam o atendimento.`},
 {section:'CAIXA',emo:'🧾',title:'Abra, movimente e feche o caixa',body:`Abra o caixa com o valor inicial. Durante o turno, registre entradas e saídas/sangrias. No fechamento, informe o valor contado.<br><br><b>Somente dinheiro</b> altera o saldo físico da gaveta; Pix e cartões permanecem no faturamento, mas não no caixa físico.`},
 {section:'CLIENTES',emo:'👥',title:'Cadastre clientes e vendas a prazo',body:`Clientes têm telefone/WhatsApp, CPF/CNPJ, e-mail e endereço. Ao digitar um CEP válido com internet, o PDVMix tenta preencher rua, bairro, cidade e UF.<br><br>No Fiado, selecione o cliente e o vencimento; uma conta a receber é criada automaticamente.`},
 {section:'FORNECEDORES',emo:'🚚',title:'Organize fornecedores e compras',body:`Cadastre fornecedores com contato, CPF/CNPJ, telefone e endereço. Em <b>Financeiro → Compras</b>, registre reposições, forma de pagamento, vencimento e vínculo com o produto.<br><br>Uma compra pode aumentar o estoque e atualizar o custo unitário.`},
 {section:'DESPESAS',emo:'🧮',title:'Registre despesas e contas a pagar',body:`Use <b>Financeiro → Compras/Despesas</b> para aluguel, energia, funcionários, impostos, marketing, manutenção, frete e outros gastos.<br><br>Valores usam R$. Se ficar pendente, aparece em <b>A PAGAR</b>.`},
 {section:'FINANCEIRO',emo:'📊',title:'Leia o painel financeiro',body:`Escolha período <b>Diário, Semanal, Mensal ou Anual</b>. Acompanhe A Receber, A Pagar, faturamento, CMV, despesas, taxas, descontos, ticket médio, resultado estimado e fluxo líquido.<br><br>Os blocos usam cores diferentes para facilitar a leitura.`},
 {section:'GRÁFICOS',emo:'🥧',title:'Use gráficos para entender o negócio',body:`Na Visão Geral, confira os gráficos pizza de <b>formas de pagamento</b> e <b>categorias vendidas</b>, além da evolução de receitas e saídas. Isso ajuda a perceber de onde vem o faturamento e onde o dinheiro está saindo.`},
 {section:'MÚLTIPLOS NEGÓCIOS',emo:'🏪',title:'Use a mesma conta em vários negócios',body:`Toque no nome da empresa no topo para abrir <b>Meus negócios e módulos</b>. Você pode ter uma loja de açaí e uma operação de marmitas na mesma conta, com dados totalmente separados.<br><br>Também pode escolher se o app abre o último negócio ou sempre pergunta qual deseja acessar.`},
 {section:'BACKUP',emo:'💾',title:'Proteja todos os seus dados',body:`O PDVMix é offline-first e armazena dados localmente. Exporte backup regularmente em <b>Ajustes → Backup e dados</b>.<br><br>O backup inclui todos os negócios da conta e deve ser guardado fora do aparelho quando possível.`},
 {section:'CHECKLIST',emo:'✅',title:'Checklist antes de começar',body:`Confira: produtos e custos revisados; estoque correto; fornecedores cadastrados; taxas configuradas; caixa aberto; venda de teste realizada; financeiro conferido; backup exportado; aplicativo instalado.<br><br>Você pode abrir este tutorial novamente ou ir direto a qualquer assunto pelo índice.`,action:{label:'📲 Instalar / confirmar instalação',fn:'installPWA()'}}
];

const MEAL_TUT_STEPS=[
 {section:'VISÃO GERAL',emo:'🍱',title:'Bem-vindo ao PDVMix Marmitas',body:`Este módulo é uma ferramenta de <b>gestão e administração</b>, não uma frente de caixa. Organize clientes, cardápio, produção, pedidos, entregas, agenda, divulgação, recebimentos e custos.<br><br>A operação ideal é: produzir → disponibilizar → divulgar → receber pedido → reservar → entregar → receber → analisar resultado.`},
 {section:'INSTALAÇÃO',emo:'📲',title:'Instale o PDVMix no aparelho',body:`Use como aplicativo no <b>Desktop, Tablet, iPhone ou Android</b>. No Android/Chrome/Edge, escolha “Instalar app”. No iPhone/iPad, use Safari → Compartilhar → Adicionar à Tela de Início.`,note:'O núcleo funciona offline. Consulta automática de CEP e abertura do WhatsApp dependem de conexão.',action:{label:'📲 Instalar PDVMix agora',fn:'installPWA()'}},
 {section:'NAVEGAÇÃO',emo:'🧭',title:'Use a barra inferior sem se perder',body:`A barra fixa traz seis acessos: <b>Início, Pedidos, Agenda, Marmitas, Clientes e Financeiro</b>. O botão ativo salta para fora da barra, ficando maior e mais fácil de identificar.<br><br><b>Ajustes</b> fica na engrenagem do topo para liberar espaço.`},
 {section:'MARCA',emo:'🎨',title:'Configure a identidade da empresa',body:`Em <b>Ajustes</b>, informe nome, WhatsApp, Instagram, slogan e logo. O logo pode aparecer no topo e no cardápio/PDF enviado aos clientes.<br><br>O módulo usa a identidade verde, creme, marrom e laranja.`},
 {section:'CLIENTES',emo:'👥',title:'Cadastre clientes para pedidos e entregas',body:`Salve nome, WhatsApp, CPF/CNPJ, e-mail, CEP, rua, número, complemento, bairro, cidade, UF e observações.<br><br>Telefone e documentos recebem máscaras automáticas. Com internet, o CEP pode preencher o endereço.`},
 {section:'FORNECEDORES',emo:'🚚',title:'Produção própria ou fornecedores externos',body:`Em Marmitas → Fornecedores, escolha <b>Produção própria</b> quando a própria empresa prepara a marmita. Cadastre mercados, embalagens, prestadores e entregadores quando forem externos.<br><br>Os dados podem incluir telefone, documento e endereço.`},
 {section:'MARMITAS',emo:'🥗',title:'Cadastre cada sabor com margem',body:`Cadastre foto, nome, descrição, preço, peso, validade, estoque e origem. Na composição de custo, separe <b>ingredientes, embalagem, mão de obra por unidade e outros custos</b>.<br><br>O PDVMix mostra custo total, lucro unitário e margem.`},
 {section:'PRODUÇÃO',emo:'👩‍🍳',title:'Planeje a produção semanal',body:`Registre quanto pretende produzir e quanto realmente produziu. Ao salvar, o estoque pronto aumenta.<br><br>Use validade/lote e observações para manter a produção organizada. A produção registrada também aparece na Agenda.`},
 {section:'ESTOQUE PRONTO',emo:'❄️',title:'Entenda produzido, reservado e disponível',body:`O painel separa <b>Estoque pronto</b>, <b>Reservadas</b> em pedidos e <b>Disponíveis</b> para novas vendas. Assim você evita prometer ao cliente uma unidade que já está comprometida.`},
 {section:'PEDIDOS',emo:'🧾',title:'Monte um pedido por cliente',body:`Escolha o cliente, marmitas, quantidades, entrega ou retirada, data e horário. Informe taxa de entrega, desconto e observações.<br><br>O pedido reserva o estoque e segue por Pedido recebido → Preparando → Pronto → Entregue.`},
 {section:'DESCONTOS',emo:'🏷️',title:'Dê desconto em % ou em R$',body:`No pedido, escolha <b>%</b> ou <b>R$</b>. O aplicativo calcula o desconto e apresenta o valor final. A taxa de entrega fica fora da base do desconto percentual.<br><br>Campos monetários usam máscara R$ e percentuais usam máscara %.`},
 {section:'PAGAMENTOS',emo:'💳',title:'Registre Pix, Crédito, Débito e Dinheiro',body:`Cada pedido pode usar <b>Pix, Crédito, Débito, Dinheiro, Transferência ou A receber</b>. Em Dinheiro, informe o valor recebido e o PDVMix calcula o troco.<br><br>Pedidos entregues ainda não pagos entram automaticamente em <b>A RECEBER</b>.`},
 {section:'AGENDA',emo:'📅',title:'Use a Agenda como cronograma do negócio',body:`A Agenda reúne automaticamente <b>entregas/retiradas, produção, contas a receber e contas a pagar</b>. Você também pode criar compromissos próprios para compra de insumos, divulgação, reuniões ou tarefas.<br><br>Navegue por mês e toque no dia para ver os detalhes.`},
 {section:'WHATSAPP',emo:'📲',title:'Divulgue e fale com o cliente',body:`Use <b>Divulgar</b> para preparar uma mensagem com as marmitas disponíveis e abrir o WhatsApp. Nos pedidos, o botão WhatsApp prepara um resumo com itens, valor e entrega para o cliente.`},
 {section:'CARDÁPIO',emo:'🖼️',title:'Gere cardápio e PDF com a sua marca',body:`Em Marmitas, gere o <b>Cardápio / PDF</b> usando logo, fotos, descrição e preços. Você pode imprimir/salvar como PDF e enviar para clientes.`},
 {section:'CUSTOS',emo:'🧮',title:'Registre custos e mão de obra',body:`No Financeiro, registre ingredientes, embalagens, gás, energia, entregas, marketing, impostos, serviços e <b>mão de obra</b>.<br><br>Para mão de obra, informe horas × valor/hora. Custos pendentes aparecem em <b>A PAGAR</b> e também na Agenda.`},
 {section:'FINANCEIRO',emo:'📊',title:'Acompanhe resultado, não apenas faturamento',body:`A Visão Geral destaca <b>Faturamento, A Receber, A Pagar e Resultado Estimado</b>. Também mostra CMV, custos operacionais, mão de obra, taxas, ticket médio, unidades vendidas, descontos e margem.<br><br>Use as abas Receitas, Custos, A Receber e A Pagar para detalhar.`},
 {section:'GRÁFICOS',emo:'🥧',title:'Entenda as formas de pagamento e custos',body:`Confira o gráfico pizza de formas de pagamento e a comparação <b>Receitas x Custos</b>. As taxas configuradas de Pix, Crédito e Débito entram no resultado gerencial.`},
 {section:'MÚLTIPLOS NEGÓCIOS',emo:'🏪',title:'Troque de módulo sem criar outro login',body:`Toque no nome da empresa no topo para acessar <b>Meus negócios e módulos</b>. Você pode criar uma operação de Açaíteria e outra de Marmitas na mesma conta, mantendo dados separados.<br><br>Escolha abrir o último negócio ou sempre selecionar ao iniciar.`},
 {section:'BACKUP',emo:'💾',title:'Faça backup de todos os negócios',body:`Os dados ficam localmente para o app funcionar offline. Exporte backups com frequência. O arquivo inclui os negócios da conta e pode restaurar os dados em outro aparelho.`},
 {section:'CHECKLIST',emo:'✅',title:'Checklist para operar a semana',body:`Confira: identidade e logo; clientes; fornecedores; marmitas e custos; produção registrada; estoque disponível; pedidos e agenda; pagamentos; custos e contas a pagar; financeiro; divulgação; backup e instalação do PWA.<br><br>Use o índice do tutorial para voltar diretamente a qualquer assunto.`,action:{label:'📲 Instalar / confirmar instalação',fn:'installPWA()'}}
];
function tutorialSteps(){return isMealMode()?MEAL_TUT_STEPS:TUT_STEPS}
function maybeStartTutorial(){if(!localStorage.getItem(TUT_DONE_KEY)&&!document.querySelector('.modal')){const steps=tutorialSteps(),step=parseInt(localStorage.getItem(TUT_STEP_KEY)||'0',10)||0;openTutorial(Math.min(step,steps.length-1));}}
function openTutorial(step=0){const steps=tutorialSteps();step=Math.max(0,Math.min(Number(step)||0,steps.length-1));localStorage.setItem(TUT_STEP_KEY,String(step));const t=steps[step],last=step===steps.length-1,pct=Math.round(((step+1)/steps.length)*100);const extra=t.tip?`<div class="tut-tip">💡 ${t.tip}</div>`:t.note?`<div class="tut-note">✓ ${t.note}</div>`:'';const action=t.action?`<button class="btn green block" style="margin-top:12px" onclick="${t.action.fn}">${t.action.label}</button>`:'';showSheet('Tutorial PDVMix',`<div class="tut-hero"><div class="tut-emo">${t.emo}</div><div><div class="tut-kicker">${t.section}</div><div class="tut-title">${t.title}</div></div></div><div class="tut-progress"><i style="width:${pct}%"></i></div><div class="tut-count"><span>Etapa ${step+1} de ${steps.length}</span><button class="linkbtn" onclick="openTutorialIndex()">Ver índice</button></div><div class="tut-body">${t.body}</div>${extra}${action}`,`${step>0?`<button class="btn gray" onclick="openTutorial(${step-1})">‹ Anterior</button>`:`<button class="btn gray" onclick="finishTutorial(true)">Pular</button>`}<button class="btn primary" onclick="${last?'finishTutorial(false)':`openTutorial(${step+1})`}">${last?'✓ Concluir':'Próximo ›'}</button>`)}
function finishTutorial(skipped=false){localStorage.setItem(TUT_DONE_KEY,'1');localStorage.removeItem(TUT_STEP_KEY);closeSheet();toast(skipped?'Tutorial fechado. Você pode rever em Ajustes.':'Tutorial concluído. Bom trabalho!');}
function openTutorialIndex(){const steps=tutorialSteps(),groups=steps.map((t,i)=>`<button onclick="openTutorial(${i})"><span class="n">${i+1}</span><span class="tx"><b>${t.emo} ${t.title}</b><span>${t.section}</span></span></button>`).join('');showSheet('Índice do tutorial',`<div class="tut-body" style="margin-bottom:12px">Escolha um assunto para ir direto à explicação. Seu progresso fica salvo neste aparelho.</div><div class="tut-index">${groups}</div>`,`<button class="btn gray" onclick="closeSheet()">Fechar</button><button class="btn primary" onclick="openTutorial(parseInt(localStorage.getItem(TUT_STEP_KEY)||'0',10)||0)">Retomar</button>`)}
function showSheet(title,body,foot=''){ $('modals').innerHTML=`<div class="modal" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="mh"><h2>${title}</h2><button class="x" onclick="closeSheet()">✕</button></div><div class="mb">${body}</div>${foot?`<div class="mf">${foot}</div>`:''}</div></div>`;setTimeout(enhanceNumericMasks,0) }function closeSheet(){$('modals').innerHTML=''}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e});function installPWA(){if(matchMedia('(display-mode: standalone)').matches){toast('O PDVMix já está instalado.');return}if(deferredInstallPrompt){deferredInstallPrompt.prompt();deferredInstallPrompt.userChoice.finally(()=>deferredInstallPrompt=null)}else toast('No navegador, use “Instalar app” ou “Adicionar à tela inicial”.')}
function updateOnline(){document.body.classList.toggle('offline',!navigator.onLine)}window.addEventListener('online',updateOnline);window.addEventListener('offline',updateOnline);updateOnline();
window.addEventListener('DOMContentLoaded',()=>{setTimeout(()=>{$('splash').classList.add('hidden');showAuth()},650)});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}

document.addEventListener('focusin',e=>{if(window.innerWidth<=700&&e.target?.matches?.('input,select,textarea'))setTimeout(()=>{try{e.target.scrollIntoView({behavior:'smooth',block:'center'})}catch(x){}},280)});
</script>
</body>
